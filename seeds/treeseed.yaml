name: treeseed
version: 1
description: TreeSeed platform development and operations portfolio

defaultEnvironments:
  - local

environments:
  - local
  - staging
  - prod

resources:
  teams:
    - key: team:treeseed
      slug: treeseed
      name: treeseed
      displayName: TreeSeed
      profileSummary: TreeSeed platform market, integrated package, and agent operations.

  projects:
    - key: project:treeseed/market
      team: team:treeseed
      slug: market
      name: TreeSeed Market
      description: Top-level market application and control plane.
      kind: market_app
      repository:
        role: primary
        provider: github
        owner: knowledge-coop
        name: market
        gitUrl: https://github.com/knowledge-coop/market.git
        defaultBranch: main
        checkoutPath: .

  capacityProviders:
    - key: capacity-provider:treeseed/local-dev
      environments: [local]
      team: team:treeseed
      name: treeseed-local-dev
      kind: local
      provider: local
      billingScope: team
      monthlyCreditBudget: 100000
      dailyCreditBudget: 10000
      maxConcurrentWorkdays: 2
      maxConcurrentWorkers: 4
      registration:
        apiKey:
          createIfMissing: true
          name: TreeSeed local provider security code
          scopes:
            - provider:heartbeat
            - provider:tasks:claim
            - provider:tasks:update
            - provider:usage:report
            - provider:lanes:read
            - provider:registration:complete
      lanes:
        - key: lane:treeseed/local-dev/codex
          name: local-codex
          businessModel: subscription
          modelFamily: codex
          modelClass: coding_agent
          unit: treeseed_credit
          scarcityLevel: low
        - key: lane:treeseed/local-dev/worker
          name: local-worker
          businessModel: local
          modelFamily: local
          modelClass: worker
          unit: worker_minute
          scarcityLevel: medium

    - key: capacity-provider:treeseed/production
      environments: [staging, prod]
      team: team:treeseed
      name: treeseed-production
      kind: managed
      provider: railway
      billingScope: team
      monthlyCreditBudget: 50000
      dailyCreditBudget: 5000
      maxConcurrentWorkdays: 2
      maxConcurrentWorkers: 8
      registration:
        apiKey:
          createIfMissing: true
          name: TreeSeed production provider security code
          scopes:
            - provider:heartbeat
            - provider:tasks:claim
            - provider:tasks:update
            - provider:usage:report
            - provider:lanes:read
            - provider:registration:complete
      lanes:
        - key: lane:treeseed/production/codex
          name: codex-production
          businessModel: subscription
          modelFamily: codex
          modelClass: coding_agent
          unit: treeseed_credit
          scarcityLevel: high
        - key: lane:treeseed/production/workday-runner
          name: workday-runner
          businessModel: managed_runtime
          modelFamily: railway
          modelClass: worker_pool
          unit: quota_minute
          scarcityLevel: medium

  capacityGrants:
    - key: grant:treeseed/local-dev/all-projects
      environments: [local]
      provider: capacity-provider:treeseed/local-dev
      team: team:treeseed
      grantScope: team
      dailyCreditLimit: 10000
      monthlyCreditLimit: 100000
      priorityWeight: 1
      overflowPolicy: soft_grant

    - key: grant:treeseed/prod/market
      environments: [prod]
      provider: capacity-provider:treeseed/production
      team: team:treeseed
      project: project:treeseed/market
      environment: prod
      grantScope: project
      dailyCreditLimit: 2500
      monthlyCreditLimit: 25000
      priorityWeight: 10
      overflowPolicy: approval_required

    - key: grant:treeseed/staging/market
      environments: [staging]
      provider: capacity-provider:treeseed/production
      team: team:treeseed
      project: project:treeseed/market
      environment: staging
      grantScope: project
      dailyCreditLimit: 2500
      monthlyCreditLimit: 25000
      priorityWeight: 8
      overflowPolicy: approval_required

  workPolicies:
    - key: work-policy:treeseed/local/market
      environments: [local]
      project: project:treeseed/market
      environment: local
      enabled: true
      startCron: "0 9 * * 1-5"
      durationMinutes: 480
      maxRunners: 1
      maxWorkersPerRunner: 4
      dailyCreditBudget: 5000
      maxQueuedTasks: 100
      maxQueuedCredits: 10000

    - key: work-policy:treeseed/staging/market
      environments: [staging]
      project: project:treeseed/market
      environment: staging
      enabled: true
      startCron: "0 9 * * 1-5"
      durationMinutes: 480
      maxRunners: 1
      maxWorkersPerRunner: 4
      dailyCreditBudget: 2500
      maxQueuedTasks: 50
      maxQueuedCredits: 5000

    - key: work-policy:treeseed/prod/market
      environments: [prod]
      project: project:treeseed/market
      environment: prod
      enabled: true
      startCron: "0 9 * * 1-5"
      durationMinutes: 480
      maxRunners: 1
      maxWorkersPerRunner: 4
      dailyCreditBudget: 2500
      maxQueuedTasks: 50
      maxQueuedCredits: 5000

  repositoryHosts:
    - key: repository-host:treeseed/market-github
      team: team:treeseed
      provider: github
      name: knowledge-coop
      ownership: treeseed_managed
      accountLabel: Knowledge Coop GitHub organization
      organizationOrOwner: knowledge-coop
      defaultVisibility: public
      softwareRepositoryNameTemplate: "{project}"
      contentRepositoryNameTemplate: "{project}-content"
      allowedProjectKinds: [market_app, package, knowledge_hub]
      status: active

  hubRepositories: []
  products:
    - key: product:treeseed/market-template
      team: team:treeseed
      kind: template
      slug: treeseed-market
      title: TreeSeed Market Starter
      summary: First-party TreeSeed market control plane starter bundle.
      visibility: public
      listingEnabled: true
      offerMode: free
      manifestKey: seeds/treeseed.yaml
      artifactKey: catalog/treeseed-market/1.0.0/template
      searchText: TreeSeed market control plane starter template
      metadata:
        provider: github
        owner: knowledge-coop
        repository: market
        gitUrl: https://github.com/knowledge-coop/market.git

  catalogArtifacts:
    - key: catalog-artifact:treeseed/market-template/1.0.0
      product: product:treeseed/market-template
      version: 1.0.0
      kind: template
      contentKey: catalog/treeseed-market/1.0.0/template
      manifestKey: seeds/treeseed.yaml
      metadata:
        provider: github
        owner: knowledge-coop
        repository: market
        gitUrl: https://github.com/knowledge-coop/market.git

  agentPools: []
