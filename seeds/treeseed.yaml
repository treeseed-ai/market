        role: primary
        provider: github
        owner: treeseed-ai
        name: market
        gitUrl: https://github.com/treeseed-ai/market.git
        defaultBranch: main
        checkoutPath: .
      architecture:
        topology: split_site_content
        rootPath: .
        sitePath: .
        contentRuntimeSource: r2_preview_overlay
        localContentMaterialization: none
        requiresLocalContentForCi: false
        requiresLocalContentForDeploy: false
        contentPublishTarget:
          kind: cloudflare_r2
          prefix: market
      metadata:
        demoRole: market-control-plane
        visibility: public

