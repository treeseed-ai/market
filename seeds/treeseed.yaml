name: treeseed
version: 1
description: TreeSeed platform development and operations portfolio

defaultEnvironments:
  - local

environments:
  - local
  - staging
  - prod

resources:
  teams:
    - key: team:treeseed
      slug: treeseed
      name: treeseed
      displayName: TreeSeed
      profileSummary: TreeSeed platform, package, and agent operations.
      metadata:
        visibility: public

  teamMemberships:
    - key: membership:treeseed/adrian-webb
      team: team:treeseed
      email: adrian.webb@treeseed.dev
      roles: [team_owner]
      missingUser: defer

  projects:
    - key: project:treeseed/platform
      team: team:treeseed
      slug: platform
      name: TreeSeed Platform
      description: Public installer, integration workspace, and manager for customer-centric TreeSeed deployments.
      kind: platform
      repository:
        role: primary
        provider: github
        owner: treeseed-ai
        name: platform
        gitUrl: https://github.com/treeseed-ai/platform.git
        defaultBranch: main
        checkoutPath: .
        repositoryPolicy: &public-repository-policy
          visibility: public
          lifecycle: create-or-adopt
          deletionPolicy: retain
          defaultBranch: main
          stagingBranch: staging
          issues: true
          actions: true
          workflows: [verify.yml]
      architecture:
        topology: split_site_content
        rootPath: .
        sitePath: .
        contentPath: src/content
        contentRuntimeSource: r2_preview_overlay
        localContentMaterialization: none
        requiresLocalContentForCi: false
        requiresLocalContentForDeploy: false
        contentPublishTarget:
          kind: cloudflare_r2
          prefix: platform
      metadata:
        demoRole: platform-installer
        visibility: public
        contentMigrationMode: skeleton

    - key: project:treeseed/api
      team: team:treeseed
      slug: api
      name: TreeSeed API
      description: TreeSeed API first-party package project.
      kind: package
      repository:
        role: primary
        provider: github
        owner: treeseed-ai
        name: api
        gitUrl: https://github.com/treeseed-ai/api.git
        defaultBranch: main
        checkoutPath: packages/api
        submodulePath: packages/api
        repositoryPolicy: *public-repository-policy
      architecture:
        topology: split_site_content
        rootPath: .
        sitePath: docs
        contentPath: src/content
        contentRuntimeSource: r2_preview_overlay
        localContentMaterialization: none
        requiresLocalContentForCi: false
        requiresLocalContentForDeploy: false
        contentPublishTarget:
          kind: cloudflare_r2
          prefix: packages/api
      metadata:
        packageId: "@treeseed/api"
        packagePath: packages/api
        visibility: public
        docsSiteReadiness: ready
        releaseOwnership: treeseed.package.yaml

