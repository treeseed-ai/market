schemaVersion: 2
providerClass: agent
ownership:
  type: team
  teamId: team:treeseed
configuration:
  generation: local-agents-v1
identity:
  privateKeyRef: data://identity.json
  displayName: TreeSeed local agent capacity provider
supplyCeilings:
  maxConcurrentAssignments: 4
  maxActiveSeconds: 28800
  maxInputTokens: 4000000
  maxOutputTokens: 1000000
  maxCost: 100
  currency: USD
  maxAttempts: 3
credentialBindings:
  - id: codex-auth
    source: process-environment
    reference: TREESEED_CODEX_AUTH_FILE
    required: false
  - id: openai-api
    source: process-environment
    reference: TREESEED_CODEX_API_KEY
    required: false
  - id: appliance-inference
    source: process-environment
    reference: TREESEED_AI_GATEWAY_TOKEN
    required: false
  - id: openrouter-api
    source: process-environment
    reference: TREESEED_OPENROUTER_API_KEY
    required: false
  - id: github-copilot-auth
    source: process-environment
    reference: TREESEED_GITHUB_COPILOT_TOKEN
    required: false
  - id: opencode-auth
    source: process-environment
    reference: TREESEED_OPENCODE_AUTH_FILE
    required: false
defaultExecutionProviderId: codex-sub
executionProviders:
  - id: codex-sub
    adapter: codex
    profile: subscription
    module: builtin:codex
    protocol: responses
    credentialBindings: [codex-auth]
    minimumAssignmentDuration:
      amount: 600
      unit: seconds
    nativeLimits:
      maxConcurrentRunners: 2
      availableAgentSeconds: 28800
    lanes:
      - { id: codex-sub-communication, purpose: communication, maxConcurrentRunners: 1 }
      - { id: codex-sub-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: &agent-capabilities
      - agent-execution
      - engineering
      - research
      - planning
      - acting
      - verification
      - agent_mode_run
      - repo_read
      - repo_write
      - repository_work
  - id: codex-key
    adapter: codex
    profile: key
    module: builtin:codex
    protocol: responses
    model:
      baseUrl: https://api.openai.com/v1
    credentialBindings: [openai-api]
    minimumAssignmentDuration:
      amount: 600
      unit: seconds
    nativeLimits:
      maxConcurrentRunners: 2
      availableInputTokens: 4000000
      availableOutputTokens: 1000000
    lanes:
      - { id: codex-key-communication, purpose: communication, maxConcurrentRunners: 1 }
      - { id: codex-key-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
  - id: codex-treeseed
    adapter: codex
    profile: treeseed
    module: builtin:codex
    protocol: responses
    model:
      endpointRef: inference-gateway
      baseUrl: http://host.docker.internal:4771/v1
      model: treeseed-qwen3.5-4b
    credentialBindings: [appliance-inference]
    minimumAssignmentDuration:
      amount: 600
      unit: seconds
    nativeLimits:
      maxConcurrentRunners: 1
      availableInputTokens: 1000000
      availableOutputTokens: 250000
    lanes:
      - { id: codex-treeseed-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
  - id: ghcopilot-key
    adapter: copilot
    profile: key
    module: builtin:copilot
    protocol: responses
    credentialBindings: [github-copilot-auth]
    nativeLimits:
      maxConcurrentRunners: 2
      availableAgentSeconds: 28800
    lanes:
      - { id: ghcopilot-key-communication, purpose: communication, maxConcurrentRunners: 1 }
      - { id: ghcopilot-key-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
  - id: ghcopilot-treeseed
    adapter: copilot
    profile: treeseed
    module: builtin:copilot
    protocol: responses
    model:
      endpointRef: inference-gateway
      baseUrl: http://host.docker.internal:4771/v1
      model: treeseed-qwen3.5-4b
    credentialBindings: [appliance-inference]
    nativeLimits:
      maxConcurrentRunners: 1
      availableInputTokens: 1000000
      availableOutputTokens: 250000
    lanes:
      - { id: ghcopilot-treeseed-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
  - id: opencode-sub
    adapter: opencode
    profile: subscription
    module: builtin:opencode
    protocol: chat-completions
    credentialBindings: [opencode-auth]
    nativeLimits:
      maxConcurrentRunners: 2
      availableAgentSeconds: 28800
    lanes:
      - { id: opencode-sub-communication, purpose: communication, maxConcurrentRunners: 1 }
      - { id: opencode-sub-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
  - id: opencode-key
    adapter: opencode
    profile: key
    module: builtin:opencode
    protocol: chat-completions
    model:
      baseUrl: https://openrouter.ai/api/v1
    credentialBindings: [openrouter-api]
    nativeLimits:
      maxConcurrentRunners: 2
      availableInputTokens: 4000000
      availableOutputTokens: 1000000
      availableCost: 100
      currency: USD
    lanes:
      - { id: opencode-key-communication, purpose: communication, maxConcurrentRunners: 1 }
      - { id: opencode-key-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
  - id: opencode-treeseed
    adapter: opencode
    profile: treeseed
    module: builtin:opencode
    protocol: chat-completions
    model:
      endpointRef: inference-gateway
      baseUrl: http://host.docker.internal:4771/v1
      model: treeseed-qwen3.5-4b
    credentialBindings: [appliance-inference]
    nativeLimits:
      maxConcurrentRunners: 1
      availableInputTokens: 1000000
      availableOutputTokens: 250000
    lanes:
      - { id: opencode-treeseed-operation, purpose: operation, maxConcurrentRunners: 1 }
    capabilities: *agent-capabilities
connections: []
