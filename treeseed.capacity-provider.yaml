schemaVersion: 2
identity:
  privateKeyRef: data://identity.json
  displayName: Treeseed local engineering and research provider
executionProviders:
  - id: codex
    adapter: codex
    researchSourcePolicy:
      schemaVersion: 1
      allowedDomains:
        - example.com
        - iana.org
      requestTimeoutMs: 20000
      maxResponseBytes: 1000000
      maxRedirects: 3
      allowedContentTypes:
        - text/html
        - text/plain
        - application/json
    nativeLimits:
      maxConcurrentRunners: 1
      availableCredits: 100
    capabilities:
      - engineering
      - research
      - planning
      - acting
      - verification
      - agent_mode_run
      - repo_read
      - repo_write
      - repository_work
connections: []
