name: TreeSeed Market
slug: treeseed-market
siteUrl: https://market.treeseed.ai
contactEmail: hello@treeseed.ai
hosting:
  kind: market_control_plane
  registration: none
  marketBaseUrl: https://api.treeseed.ai
  projectId: treeseed-market
cloudflare:
  accountId: replace-with-cloudflare-account-id
  workerName: treeseed-market
  queueName: agent-work
  dlqName: agent-work-dlq
  d1Binding: SITE_DATA_DB
  queueBinding: AGENT_WORK_QUEUE
  pages:
    projectName: treeseed-market
    previewProjectName: treeseed-market-staging
    productionBranch: main
    stagingBranch: staging
    buildOutputDir: dist
  r2:
    binding: TREESEED_CONTENT_BUCKET
    bucketName: treeseed-market-content
    manifestKeyTemplate: teams/{teamId}/published/common.json
    previewRootTemplate: teams/{teamId}/previews
    previewTtlHours: 168
surfaces:
  web:
    enabled: true
    provider: cloudflare
    rootDir: .
    publicBaseUrl: https://market.treeseed.ai
    localBaseUrl: http://127.0.0.1:4321
  api:
    enabled: true
    provider: railway
    rootDir: .
    localBaseUrl: http://127.0.0.1:3000
services:
  api:
    enabled: true
    provider: railway
    rootDir: .
    publicBaseUrl: https://api.treeseed.ai
    railway:
      serviceName: treeseed-api
      buildCommand: npm run build:api
      startCommand: node ./src/api/server.js
    environments:
      local:
        baseUrl: http://127.0.0.1:3000
  manager:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-manager
      rootDir: .
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/services/manager.js
      schedule: '*/5 * * * *'
  worker:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-worker
      rootDir: .
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/services/worker.js
  agents:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-agents
      rootDir: .
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/services/agents.js
  runner:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-runner
      rootDir: .
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/services/remote-runner.js
  workdayStart:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-workday-start
      rootDir: .
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/services/workday-start.js
      schedule: '0 9 * * 1-5'
  workdayReport:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-workday-report
      rootDir: .
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/services/workday-report.js
      schedule: '5 17 * * 1-5'
plugins:
  - package: '@treeseed/core/plugin-default'
providers:
  forms: store_only
  agents:
    execution: stub
    mutation: local_branch
    repository: stub
    verification: stub
    notification: stub
    research: stub
  deploy: cloudflare
  content:
    runtime: team_scoped_r2_overlay
    publish: team_scoped_r2_overlay
    docs: default
  site: default
smtp:
  enabled: false
turnstile:
  enabled: true
