name: TreeSeed Market
slug: treeseed-market
siteUrl: https://market.treeseed.ai
contactEmail: hello@treeseed.ai
cloudflare:
  accountId: replace-with-cloudflare-account-id
  workerName: treeseed-market
  gatewayWorkerName: treeseed-agent-gateway
  queueName: agent-work
  dlqName: agent-work-dlq
  d1Binding: SITE_DATA_DB
  queueBinding: AGENT_WORK_QUEUE
surfaces:
  web:
    enabled: true
    provider: cloudflare
    rootDir: .
    publicBaseUrl: https://market.treeseed.ai
    localBaseUrl: http://127.0.0.1:4321
  api:
    enabled: true
    provider: railway
    rootDir: .
    localBaseUrl: http://127.0.0.1:3000
services:
  api:
    enabled: true
    provider: railway
    rootDir: .
    publicBaseUrl: https://api.treeseed.ai
    railway:
      serviceName: treeseed-api
      buildCommand: npm run build:api
      startCommand: node ./packages/core/dist/api/server.js
    environments:
      local:
        baseUrl: http://127.0.0.1:3000
  gateway:
    enabled: true
    provider: cloudflare
    cloudflare:
      workerName: treeseed-agent-gateway
  manager:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-manager
      rootDir: packages/agent
      startCommand: node ./dist/services/manager.js
  worker:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-worker
      rootDir: packages/agent
      startCommand: node ./dist/services/worker.js
  workdayStart:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-workday-start
      rootDir: packages/agent
      startCommand: node ./dist/services/workday-start.js
  workdayReport:
    enabled: true
    provider: railway
    railway:
      serviceName: treeseed-workday-report
      rootDir: packages/agent
      startCommand: node ./dist/services/workday-report.js
plugins:
  - package: '@treeseed/core/plugin-default'
providers:
  forms: store_only
  agents:
    execution: stub
    mutation: local_branch
    repository: stub
    verification: stub
    notification: stub
    research: stub
  deploy: cloudflare
  content:
    docs: default
  site: default
smtp:
  enabled: false
turnstile:
  enabled: true
