name: TreeSeed Market
slug: treeseed-market
siteUrl: https://treeseed.ai
contactEmail: hello@treeseed.email
hosting:
  kind: market_control_plane
  registration: none
  teamId: treeseed
  projectId: market
hub:
  mode: treeseed_hosted
runtime:
  mode: treeseed_managed
  registration: none
cloudflare:
  workerName: treeseed-market
  queueName: agent-work
  dlqName: agent-work-dlq
  d1Binding: SITE_DATA_DB
  queueBinding: AGENT_WORK_QUEUE
  pages:
    productionBranch: main
    stagingBranch: staging
    buildOutputDir: dist
  r2:
    manifestKeyTemplate: teams/{teamId}/published/common.json
    previewRootTemplate: teams/{teamId}/previews
    previewTtlHours: 168
surfaces:
  web:
    enabled: true
    provider: cloudflare
    rootDir: .
    publicBaseUrl: https://treeseed.ai
    localBaseUrl: http://127.0.0.1:4321
    local:
      runtime: provider
    environments:
      staging:
        domain: treeseed-market-staging-479e4625.treeseed.ai
      prod:
        domain: treeseed.ai
    cache:
      sourcePages:
        browserTtlSeconds: 0
        edgeTtlSeconds: 31536000
        staleWhileRevalidateSeconds: 86400
        staleIfErrorSeconds: 86400
        paths:
          - /
          - /contact
          - /404
      contentPages:
        browserTtlSeconds: 0
        edgeTtlSeconds: 31536000
        staleWhileRevalidateSeconds: 86400
        staleIfErrorSeconds: 86400
      r2PublishedObjects:
        browserTtlSeconds: 0
        edgeTtlSeconds: 31536000
        staleWhileRevalidateSeconds: 86400
        staleIfErrorSeconds: 86400
  api:
    enabled: true
    provider: railway
    rootDir: .
    localBaseUrl: http://127.0.0.1:3000
    environments:
      staging:
        domain: api-treeseed-market-staging-ca844c56.treeseed.ai
      prod:
        domain: api.treeseed.ai
services:
  api:
    enabled: true
    provider: railway
    rootDir: .
    railway:
      projectName: treeseed-market
      serviceName: treeseed-market-api
      rootDir: .
      buildCommand: npm run build:api
      startCommand: npm run build:api && node ./src/api/server.js
      healthcheckPath: /healthz
      healthcheckTimeoutSeconds: 120
      runtimeMode: serverless
    environments:
      local:
        baseUrl: http://127.0.0.1:3000
        railwayEnvironment: local
      staging:
        railwayEnvironment: staging
      prod:
        railwayEnvironment: prod
  workdayManager:
    enabled: true
    provider: railway
    railway:
      projectName: treeseed-market
      serviceName: treeseed-market-workday-manager
      rootDir: .
      buildCommand: npm run build:api
      startCommand: npm run build:api && node ./packages/agent/dist/services/workday-manager.js
      schedule: 0 9 * * 1-5
    environments:
      local:
        railwayEnvironment: local
      staging:
        railwayEnvironment: staging
      prod:
        railwayEnvironment: prod
  workerRunner:
    enabled: true
    provider: railway
    railway:
      projectName: treeseed-market
      rootDir: .
      buildCommand: npm run build:api
      startCommand: npm run build:api && node ./packages/agent/dist/services/worker.js
    environments:
      local:
        railwayEnvironment: local
      staging:
        railwayEnvironment: staging
      prod:
        railwayEnvironment: prod
plugins:
  - package: "@treeseed/core/plugin-default"
providers:
  forms: full_email
  agents:
    execution: copilot
    mutation: local_branch
    repository: git
    verification: local
    notification: sdk_message
    research: project_graph
  deploy: cloudflare
  dns: cloudflare-dns
  content:
    serving: local_collections
    runtime: team_scoped_r2_overlay
    publish: team_scoped_r2_overlay
    docs: default
  site: default
smtp:
  enabled: true
turnstile:
  enabled: true
