name: TreeSeed Market
slug: treeseed-market
siteUrl: https://treeseed.dev
contactEmail: hello@treeseed.email
authority:
  kind: market-singleton
market:
  profile: treeseed
controlPlane:
  mode: market-passthrough
hosting:
  kind: self_hosted_project
  registration: none
  teamId: treeseed
  projectId: market
hub:
  mode: treeseed_hosted
runtime:
  mode: treeseed_managed
  registration: none
cloudflare:
  workerName: treeseed-market
  d1Binding: SITE_DATA_DB
  pages:
    projectName: treeseed-market
    productionBranch: main
    stagingBranch: staging
    buildOutputDir: dist
  r2:
    bucketName: treeseed-market-content
    manifestKeyTemplate: teams/{teamId}/published/common.json
    previewRootTemplate: teams/{teamId}/previews
    previewTtlHours: 168
  tunnel:
    local:
      enabled: true
      # SDK scopes these base identities to the current machine/worktree deployment.
      name: treeseed-local-connectors
      hostname: connect.local.treeseed.dev
      originUrl: http://127.0.0.1:3000
surfaces:
  web:
    enabled: true
    provider: cloudflare
    rootDir: .
    publicBaseUrl: https://treeseed.dev
    localBaseUrl: http://127.0.0.1:4321
    local:
      runtime: provider
    environments:
      staging:
        domain: preview.treeseed.dev
      prod:
        domain: treeseed.dev
    cache:
      sourcePages:
        browserTtlSeconds: 0
        edgeTtlSeconds: 31536000
        staleWhileRevalidateSeconds: 86400
        staleIfErrorSeconds: 86400
        paths:
          - /
          - /contact
          - /404
      contentPages:
        browserTtlSeconds: 0
        edgeTtlSeconds: 31536000
        staleWhileRevalidateSeconds: 86400
        staleIfErrorSeconds: 86400
      r2PublishedObjects:
        browserTtlSeconds: 0
        edgeTtlSeconds: 31536000
        staleWhileRevalidateSeconds: 86400
        staleIfErrorSeconds: 86400
connections:
  api:
    proxyPrefix: /v1
    localBaseUrl: http://127.0.0.1:3000
    environments:
      staging:
        baseUrl: https://api.preview.treeseed.dev
      prod:
        baseUrl: https://api.treeseed.dev
plugins:
  - package: "@treeseed/core/plugin-default"
  - package: "@treeseed/admin/plugin"
providers:
  agents:
    execution: codex
    mutation: local_branch
    repository: git
    verification: local
    notification: sdk_message
    research: project_graph
  deploy: cloudflare
  dns: cloudflare-dns
  content:
    serving: local_collections
    runtime: team_scoped_r2_overlay
    publish: team_scoped_r2_overlay
    docs: default
  site: default
smtp:
  enabled: true
turnstile:
  enabled: true
