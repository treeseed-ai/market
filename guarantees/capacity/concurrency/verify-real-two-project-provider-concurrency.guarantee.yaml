    actor: capacity_provider
    verifierRefs: [market.capacity.failure-concurrency-matrix]
  - id: concurrent-projects-cannot-share-workspace-or-settlement
    actor: capacity_provider
    verifierRefs: [market.capacity.full-local-lifecycle]
