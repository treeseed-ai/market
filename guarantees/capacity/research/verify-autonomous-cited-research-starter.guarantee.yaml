  minimumRepositoryPostconditions: 1
  outcomePredicates:
    research.governed-synthesis: [research.dynamic-context, research.two-independent-sources, research.claim-synthesis, research.source-policy, research.unsupported-claim-denial]
    research.review-and-publication: [research.initial-rejection, research.semantic-revision, research.independent-approval, research.cited-output, research.reporting, research.settlement, research.cleanup]
outcomes:
  - id: research.governed-synthesis
    kind: required
    description: Real governed retrieval supplies at least two independent cited sources and unsupported claims are denied.
    evidenceKinds: [retrieval_receipt, citation_read_back, execution_trace]
    authoritativeSubjects: [sourceRefs, claimArtifact]
  - id: research.review-and-publication
    kind: required
    description: Rejection, semantic revision, independent approval, cited knowledge output, reporting, settlement, and cleanup use exact refs.
    evidenceKinds: [review_read_back, repository_read_back, cleanup]
    authoritativeSubjects: [rejectedCheckpointRef, approvedCheckpointRef, targetRef]
dependencies: { journeys: [], guarantees: [guarantee.agent.system.source-golden.917] }
actors:
  allowed: [team_owner, capacity_provider, capacity_operator]
  forbidden: [unapproved_capacity_provider, revoked_capacity_provider]
gates: [future]
preconditions:
  fixtures: [integrated_treeseed_project]
  notes:
    - "The canonical local development stack and reconciled research starter TreeDX repository must be ready."
scene:
  required: false
api:
  required: true
  verifierRefs: [market.agent-catalog.golden-live-proof]
content:
  required: true
  verifierRefs: [market.agent-catalog.golden-live-proof]
audit:
  required: true
  verifierRefs: [market.agent-catalog.golden-live-proof]
negativeCases:
  - id: unsupported-material-claim-cannot-pass-review
    actor: capacity_provider
    verifierRefs: [market.agent-catalog.golden-live-proof]
  - id: research-cannot-bypass-source-policy
    actor: capacity_provider
    verifierRefs: [market.agent-catalog.golden-live-proof]
