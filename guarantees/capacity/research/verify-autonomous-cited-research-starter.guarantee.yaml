schemaVersion: treeseed.guarantee/v2
id: guarantee.capacity.research.verify-autonomous-cited-research-starter.510
journeyIndex: 510
type: capacity
subtype: research
journey: Verify Autonomous Cited Research Starter
ownerPackage: "@treeseed/market"
surface: agent-runtime
summary: "Prove the reconciled research starter autonomously decomposes a question, applies source policy, gathers independent evidence, rejects an unsupported claim, revises it, preserves contradiction, publishes cited knowledge, reports the workday, settles usage, and cleans up."
status: planned
capabilityId: agent.system.research-golden
catalog: agent.system
activation: { minimumConsecutivePasses: 3, requiredVariants: [baseline, clean-repeat, interruption-resume], invalidateOnSourceChange: true }
proof:
