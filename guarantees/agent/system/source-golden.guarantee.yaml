    source.semantic-repository-outcome: [source.exact-local-ref, source.exact-remote-ref, source.behavior, source.verification, source.receipt, source.review, source.integration, source.zero-residue]
    source.rejection-revision: [source.fixture-provenance, source.initial-rejection, source.real-codex-revision, source.distinct-final-reviewer, source.exact-revision-approval]
outcomes:
  - id: source.complete-governed-lifecycle
    kind: required
    description: Proposal, simulated-human decision, estimate, accepted plan, acting, review, report, and settlement use exact refs and authenticated CLI operations.
    evidenceKinds: [redacted_cli_transcript, workflow_graph]
    authoritativeSubjects: [proposalRevision, decision, capacityPlan, workday, targetRef]
  - id: source.semantic-repository-outcome
    kind: required
    description: Required behavior exists at exact local and remote refs with verification, receipts, review, integration, and zero residue.
    evidenceKinds: [git_read_back, verification, mutation_receipt, cleanup]
    authoritativeSubjects: [checkpointRef, reviewedRef, integratedRef, remoteRef]
  - id: source.rejection-revision
    kind: required
    variants: [interruption-resume]
    description: The interruption variant rejects a pre-seeded deficient checkpoint, real Codex revises it, and a distinct reviewer approves the revision.
    evidenceKinds: [fixture_provenance, review_read_back, revised_diff]
    authoritativeSubjects: [deficientCheckpointRef, rejectionRef, revisedCheckpointRef, approvalRef]
