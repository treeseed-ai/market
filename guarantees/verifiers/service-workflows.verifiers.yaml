  market.capacity.sdk-operator-contract:
    kind: vitestCase
    ownerPackage: "@treeseed/sdk"
    testFile: tests/unit/agent-capacity/capacity-operator-surface.test.ts
    timeoutSeconds: 60
  market.capacity.sdk-configuration-contract:
    kind: vitestCase
    ownerPackage: "@treeseed/sdk"
    testFile: tests/contract/agent-capacity/capacity-configuration.test.ts
    timeoutSeconds: 60
  market.capacity.api-operator-contract:
    kind: vitestCase
