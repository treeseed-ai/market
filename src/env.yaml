entries:
  TREESEED_PROJECT_DOMAINS:
    label: Project custom domains
    group: auth
    description: Comma-separated domains for the web-facing project surfaces. Treeseed uses this as a shared hint when it needs to complete environment-specific URL defaults.
    howToGet: List one or more custom domains, separated by commas. Leave the default if the primary site URL already reflects the right domain.
    sensitivity: plain
    targets:
      - github-variable
      - railway-var
      - cloudflare-var
    scopes:
      - staging
      - prod
    storage: shared
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: projectDomainsDefault
    relevanceRef: webSurfaceEnabled
  TREESEED_API_BASE_URL:
    label: Treeseed API base URL
    group: auth
    description: Base URL for the API used by the site BFF, CLI, and remote auth flows. Local defaults should resolve automatically from the integrated runtime, while hosted environments prefer configured service URLs and project domains.
    howToGet: Override this only when the generated local or hosted API URL is wrong for the selected environment.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - railway-var
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: apiBaseUrlDefault
    relevanceRef: apiSurfaceEnabled
  TREESEED_BETTER_AUTH_SECRET:
    label: Better Auth secret
    group: auth
    description: Core Better Auth signing secret used by the Astro-side browser authentication boundary.
    howToGet: Generate a strong random secret and keep it stable per environment.
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_SERVICE_ID:
    label: Web service ID
    group: auth
    description: Stable internal service identity used by the Astro BFF when it calls the Railway API.
    howToGet: Use a short service identifier such as web.
    sensitivity: plain
    targets:
