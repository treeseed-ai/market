      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: webServiceIdDefault
    localDefaultValueRef: webServiceIdDefault
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_SERVICE_SECRET:
