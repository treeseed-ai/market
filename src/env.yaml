entries:
  TREESEED_BETTER_AUTH_SECRET:
    label: Better Auth secret
    group: auth
    description: Core Better Auth signing secret used by the Astro-side browser authentication boundary.
    howToGet: Generate a strong random secret and keep it stable per environment.
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_SERVICE_ID:
    label: Web service ID
    group: auth
    description: Stable internal service identity used by the Astro BFF when it calls the Railway API.
    howToGet: Use a short service identifier such as web.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - railway-var
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: webServiceIdDefault
    localDefaultValueRef: webServiceIdDefault
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_SERVICE_SECRET:
    label: Web service secret
    group: auth
    description: Shared secret used by the Astro BFF to authenticate to the Railway API as the trusted web tier.
    howToGet: Generate a strong random secret and configure the same value on both the web and API services.
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - railway-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_ASSERTION_SECRET:
    label: Web assertion secret
    group: auth
    description: Signs short-lived user-context assertions from the Astro BFF to the Railway API.
    howToGet: Generate a strong random secret and configure the same value on both the web and API services.
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - railway-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_CSRF_SECRET:
    label: Web CSRF secret
    group: auth
    description: Secret used by the Astro-side auth layer to mint and verify CSRF protections for browser actions.
    howToGet: Generate a strong random secret and keep it stable per environment.
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_MODE:
    label: Authentication mode
    group: auth
    description: Controls which sign-in methods are available in the market web UI and BetterAuth API.
    howToGet: Use internal-first for normal operation. Use internal-only for local development without OAuth credentials. Use providers-only only when internal email/password login should be disabled.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: enum
      values:
        - internal-first
        - internal-only
        - providers-only
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_INTERNAL_SIGNUP:
    label: Internal signup mode
    group: auth
    description: Controls whether the market web surface allows users to create internal BetterAuth email/password accounts.
    howToGet: Use open for the top-level market. Core-owned deployments should use invite or admin.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: enum
      values:
        - open
        - invite
        - admin
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_EMAIL_LINKING:
    label: Verified email account linking
    group: auth
    description: Enables BetterAuth and core identity sync to link a trusted OAuth identity to an existing internal user when the provider returns the same verified email address.
    howToGet: Set to true unless you need strict one-provider-per-user isolation.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: boolean
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_ALLOW_MEMORY_DB:
    label: Allow memory auth fallback
    group: auth
    description: Allows isolated local or test auth flows to use an in-memory adapter when the backend Market database is unavailable. Do not enable this in staging or production.
    howToGet: Set to true only for isolated local tests that do not bind Cloudflare D1.
    sensitivity: plain
    targets:
      - local-runtime
    scopes:
      - local
    requirement: optional
    purposes:
      - dev
      - config
    validation:
      kind: boolean
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  BETTER_AUTH_URL:
    label: BetterAuth base URL
    group: auth
    description: Public base URL BetterAuth uses to generate callback URLs and cookies for the web surface.
    howToGet: Use http://127.0.0.1:4321 locally. Use the deployed market web origin in staging and production.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: url
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_SITE_URL:
    label: Market site URL
    group: auth
    description: Public market web origin used as a fallback for BetterAuth and browser redirects.
    howToGet: Use http://127.0.0.1:4321 locally. Use the deployed market web origin in staging and production.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: url
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_WEB_SESSION_TTL:
    label: Web session TTL
    group: auth
    description: Browser web-session lifetime in seconds for the market Astro session cookie and D1 web_sessions row.
    howToGet: Use 604800 for seven days, or a shorter value for stricter environments.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: number
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_PASSWORD_RESET_TTL:
    label: Password reset link TTL
    group: auth
    description: Number of seconds a BetterAuth password reset link remains valid.
    howToGet: Use 3600 for a one-hour reset window. Shorten for stricter environments, or lengthen only when your support workflow needs more time.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: number
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_EMAIL_VERIFICATION_TTL:
    label: Email verification link TTL
    group: auth
    description: Number of seconds a BetterAuth registration email verification link remains valid.
    howToGet: Use 3600 for a one-hour verification window. Users can request another verification email if the link expires.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: number
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_EMAIL_VERIFICATION_ENABLED:
    label: Email verification enabled
    group: auth
    description: Enables BetterAuth email verification delivery for internal email/password sign-up.
    howToGet: Use true in hosted environments with SMTP configured. Set false only for isolated tests or local harnesses that intentionally bypass email delivery.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: boolean
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_EMAIL_FROM:
    label: Auth email from address
    group: auth
    description: Optional sender identity override used for market account verification and password reset email.
    howToGet: |
      Local recipe:
      1. Local SMTP defaults to Mailpit through TREESEED_SMTP_HOST=127.0.0.1 and TREESEED_SMTP_PORT=1025.
      2. This can be a development sender identity such as Treeseed Market <auth@treeseed.local>.
      3. Open http://127.0.0.1:8025 to inspect the captured message.
      Hosted recipe:
      1. Choose the mail provider you use for transactional email.
      2. Verify the sender domain or mailbox with that provider.
      3. Use the verified mailbox here, for example Treeseed Market <auth@example.com>.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_EMAIL_REPLY_TO:
    label: Auth email reply-to
    group: auth
    description: Optional reply-to mailbox attached to account verification and password reset email.
    howToGet: Use a monitored support or operations mailbox. Leave empty to omit Reply-To.
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: email
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_GITHUB_CLIENT_ID:
    label: GitHub OAuth client ID
    group: auth
    description: OAuth client ID used by BetterAuth for GitHub sign-in. Register the exact callback URL for each environment; local development uses http://127.0.0.1:4321/api/auth/callback/github.
    howToGet: |
      Recipe:
      1. Open GitHub Developer settings: https://github.com/settings/developers
      2. Choose "OAuth Apps", then "New OAuth App". For an organization-owned app, create it from the organization settings instead.
      3. Set "Application name" to the market name, for example Treeseed Market.
      4. Set "Homepage URL" to the public market web origin. Local development can use http://127.0.0.1:4321.
      5. Set "Authorization callback URL" exactly:
         - Local: http://127.0.0.1:4321/api/auth/callback/github
         - Staging: https://<staging-market-domain>/api/auth/callback/github
         - Production: https://<production-market-domain>/api/auth/callback/github
      6. Click "Register application" and copy the "Client ID" into TREESEED_AUTH_GITHUB_CLIENT_ID.
      7. Create or copy the matching client secret into TREESEED_AUTH_GITHUB_CLIENT_SECRET.
      Docs:
      - Creating a GitHub OAuth App: https://docs.github.com/en/developers/apps/creating-an-oauth-app
      - OAuth app authorization flow: https://docs.github.com/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_GITHUB_CLIENT_SECRET:
    label: GitHub OAuth client secret
    group: auth
    description: OAuth client secret used by BetterAuth for GitHub sign-in. Leave unset locally to hide GitHub sign-in and use internal password auth.
    howToGet: |
      Recipe:
      1. Open the same GitHub OAuth App used for TREESEED_AUTH_GITHUB_CLIENT_ID: https://github.com/settings/developers
      2. Confirm the callback URL is exact for this environment: <site-url>/api/auth/callback/github.
      3. Under "Client secrets", click "Generate a new client secret".
      4. Copy the secret immediately; GitHub will not show it again.
      5. Store it in TREESEED_AUTH_GITHUB_CLIENT_SECRET for the matching local, staging, or production environment.
      Docs:
      - Creating a GitHub OAuth App: https://docs.github.com/en/developers/apps/creating-an-oauth-app
      - GitHub OAuth app flow: https://docs.github.com/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_GOOGLE_CLIENT_ID:
    label: Google OAuth client ID
    group: auth
    description: OAuth client ID used by BetterAuth for Google sign-in. Google requires an OAuth consent screen and exact authorized redirect URI; local development uses http://127.0.0.1:4321/api/auth/callback/google.
    howToGet: |
      Recipe:
      1. Open Google Cloud Console credentials: https://console.cloud.google.com/apis/credentials
      2. Select or create the Google Cloud project for this market environment.
      3. Configure the OAuth consent screen first: https://console.cloud.google.com/apis/credentials/consent
      4. Click "Create credentials" -> "OAuth client ID".
      5. Choose application type "Web application".
      6. Add authorized JavaScript origins:
         - Local: http://127.0.0.1:4321
         - Staging: https://<staging-market-domain>
         - Production: https://<production-market-domain>
      7. Add authorized redirect URIs exactly:
         - Local: http://127.0.0.1:4321/api/auth/callback/google
         - Staging: https://<staging-market-domain>/api/auth/callback/google
         - Production: https://<production-market-domain>/api/auth/callback/google
      8. Save, then copy the "Client ID" into TREESEED_AUTH_GOOGLE_CLIENT_ID.
      9. Copy the matching "Client secret" into TREESEED_AUTH_GOOGLE_CLIENT_SECRET.
      Docs:
      - Google OAuth 2.0 for web server apps: https://developers.google.com/identity/protocols/oauth2/web-server
      - Google OAuth consent screen: https://support.google.com/cloud/answer/10311615
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_GOOGLE_CLIENT_SECRET:
    label: Google OAuth client secret
    group: auth
    description: OAuth client secret used by BetterAuth for Google sign-in. Leave unset locally to hide Google sign-in and use internal password auth.
    howToGet: |
      Recipe:
      1. Open Google Cloud Console credentials: https://console.cloud.google.com/apis/credentials
      2. Open the OAuth 2.0 Client ID used for this market environment.
      3. Confirm the authorized redirect URI is exact: <site-url>/api/auth/callback/google.
      4. Copy the "Client secret" into TREESEED_AUTH_GOOGLE_CLIENT_SECRET.
      5. If the secret has been exposed, rotate it from the same credentials page and update the environment value.
      Docs:
      - Google OAuth 2.0 web server applications: https://developers.google.com/identity/protocols/oauth2/web-server
      - Google Cloud OAuth credentials: https://console.cloud.google.com/apis/credentials
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_MICROSOFT_CLIENT_ID:
    label: Microsoft OAuth client ID
    group: auth
    description: OAuth client ID used by BetterAuth for Microsoft Entra sign-in. Register a Web redirect URI for each environment; local development uses http://127.0.0.1:4321/api/auth/callback/microsoft.
    howToGet: |
      Recipe:
      1. Open Microsoft Entra app registrations: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
      2. Click "New registration".
      3. Name the app for the market environment, for example Treeseed Market Staging.
      4. Choose the supported account types for your tenant policy.
      5. Under "Redirect URI", choose platform "Web" and enter the exact callback:
         - Local: http://127.0.0.1:4321/api/auth/callback/microsoft
         - Staging: https://<staging-market-domain>/api/auth/callback/microsoft
         - Production: https://<production-market-domain>/api/auth/callback/microsoft
      6. Register the app and copy "Application (client) ID" into TREESEED_AUTH_MICROSOFT_CLIENT_ID.
      7. Go to "Certificates & secrets" and create a client secret for TREESEED_AUTH_MICROSOFT_CLIENT_SECRET.
      Docs:
      - Register an app with Microsoft identity platform: https://learn.microsoft.com/en-us/entra/identity-platform/quickstart-register-app
      - Add redirect URIs: https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-redirect-uri
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_MICROSOFT_CLIENT_SECRET:
    label: Microsoft OAuth client secret
    group: auth
    description: OAuth client secret used by BetterAuth for Microsoft sign-in. Leave unset locally to hide Microsoft sign-in and use internal password auth.
    howToGet: |
      Recipe:
      1. Open the Microsoft Entra app registration for this market environment: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
      2. Go to "Certificates & secrets" -> "Client secrets".
      3. Click "New client secret", set a description and expiration, then click "Add".
      4. Copy the secret "Value" immediately; do not copy the "Secret ID".
      5. Store that Value in TREESEED_AUTH_MICROSOFT_CLIENT_SECRET.
      6. Track the expiration date and rotate the secret before it expires.
      Docs:
      - Add credentials to an app registration: https://learn.microsoft.com/en-us/entra/identity-platform/quickstart-register-app#add-credentials
      - Redirect URI configuration: https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-redirect-uri
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_APPLE_CLIENT_ID:
    label: Apple OAuth client ID
    group: auth
    description: OAuth client ID used by BetterAuth for Sign in with Apple. For web sign-in, the client ID is the Apple Services ID identifier; local development uses http://127.0.0.1:4321/api/auth/callback/apple.
    howToGet: |
      Recipe:
      1. Open Apple Developer identifiers: https://developer.apple.com/account/resources/identifiers/list/serviceId
      2. Create or select a "Services ID" for this market environment.
      3. Enable "Sign in with Apple" on the Services ID.
      4. Configure the associated website domains and return URLs. Add the exact callback:
         - Local: http://127.0.0.1:4321/api/auth/callback/apple
         - Staging: https://<staging-market-domain>/api/auth/callback/apple
         - Production: https://<production-market-domain>/api/auth/callback/apple
      5. Save the Services ID configuration.
      6. Copy the Services ID identifier into TREESEED_AUTH_APPLE_CLIENT_ID.
      7. Generate a client secret JWT from the Services ID, Team ID, Key ID, and private key for TREESEED_AUTH_APPLE_CLIENT_SECRET.
      Docs:
      - Configure Sign in with Apple for the web: https://developer.apple.com/help/account/capabilities/configure-sign-in-with-apple-for-the-web
      - Apple Sign in with Apple environment setup: https://developer.apple.com/documentation/signinwithapple/configuring-your-environment-for-sign-in-with-apple
    sensitivity: plain
    targets:
      - local-runtime
      - local-cloudflare
      - github-variable
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_AUTH_APPLE_CLIENT_SECRET:
    label: Apple OAuth client secret
    group: auth
    description: OAuth client secret JWT used by BetterAuth for Apple sign-in. Leave unset locally to hide Apple sign-in and use internal password auth.
    howToGet: |
      Recipe:
      1. Open Apple Developer keys: https://developer.apple.com/account/resources/authkeys/list
      2. Create or select a key with "Sign in with Apple" enabled.
      3. Record the Apple Team ID, Key ID, private key file, and Services ID identifier.
      4. Generate the client secret JWT using:
         - iss = Apple Team ID
         - sub = Services ID identifier from TREESEED_AUTH_APPLE_CLIENT_ID
         - aud = https://appleid.apple.com
         - exp = an expiration within Apple's allowed window
      5. Store the generated JWT in TREESEED_AUTH_APPLE_CLIENT_SECRET.
      6. Regenerate and rotate the JWT before it expires.
      Docs:
      - Configure Sign in with Apple for web: https://developer.apple.com/help/account/capabilities/configure-sign-in-with-apple-for-the-web
      - Apple client secret docs: https://developer.apple.com/documentation/accountorganizationaldatasharing/creating-a-client-secret
    sensitivity: secret
    targets:
      - local-runtime
      - local-cloudflare
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: webSurfaceEnabled
  TREESEED_HOSTED_HUBS_GITHUB_OWNER:
    label: Hosted repository owner
    group: github
    description: GitHub user or organization where TreeSeed-managed hosted hub repositories are created.
    howToGet: Enter the GitHub organization or owner dedicated to hosted Knowledge Hub repositories. This can be different from the Market source repository owner.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    scopes:
      - staging
      - prod
    storage: shared
    requirement: conditional
