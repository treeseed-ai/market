entries:
  TREESEED_API_BASE_URL:
    label: Treeseed API base URL
    group: auth
    description: Base URL for the Railway-hosted Treeseed API used by the site BFF, CLI, and remote auth flows.
    howToGet: Use the public API domain for the active environment, such as https://api.treeseed.ai or the Railway public URL during setup.
    sensitivity: plain
    targets:
      - local-file
      - wrangler-dev-vars
      - github-variable
      - railway-var
      - cloudflare-var
    scopes:
      - local
      - staging
      - prod
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
  TREESEED_BETTER_AUTH_SECRET:
    label: Better Auth secret
    group: auth
    description: Core Better Auth signing secret used by the Astro-side browser authentication boundary.
    howToGet: Generate a strong random secret and keep it stable per environment.
    sensitivity: secret
    targets:
      - local-file
      - wrangler-dev-vars
      - github-secret
      - cloudflare-secret
    scopes:
      - local
      - staging
      - prod
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
  TREESEED_WEB_SERVICE_ID:
    label: Web service ID
    group: auth
    description: Stable internal service identity used by the Astro BFF when it calls the Railway API.
    howToGet: Use a short service identifier such as web.
    sensitivity: plain
    targets:
      - local-file
      - wrangler-dev-vars
      - railway-var
      - cloudflare-var
    scopes:
      - local
      - staging
