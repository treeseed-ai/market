const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],escapeHtml=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const profiles={planning:{label:'Planning',job:'Propose direction',handler:'writer',purpose:'Turn evidence into decision-ready proposals.',color:'#3a8587',signals:['evidence-ready','proposal-estimated'],providers:['Codex','OpenCode']},estimating:{label:'Estimating',job:'Scope effort',handler:'estimate',purpose:'Estimate proposed work before allocation.',color:'#9a7425',signals:['proposal-ready'],providers:['Codex','OpenCode']},acting:{label:'Acting',job:'Execute decisions',handler:'writer',purpose:'Apply only approved, assigned changes.',color:'#4f7d4e',signals:['governed-execution-ready'],providers:['Codex','OpenCode']},reviewing:{label:'Reviewing',job:'Verify work',handler:'writer',purpose:'Test evidence, quality, and acceptance criteria.',color:'#76558e',signals:['artifact-ready'],providers:['Codex','OpenCode']},reporting:{label:'Reporting',job:'Summarize evidence',handler:'reporter',purpose:'Create deterministic workday and outcome reports.',color:'#55718a',signals:['workday-closeout-ready'],providers:['Codex','OpenCode']},chat:{label:'Chat',job:'Discuss in context',handler:'writer',purpose:'Participate in governed project discussion.',color:'#8a6552',signals:['discussion-message-created'],providers:['Codex','OpenCode']}};
const identity={handle:'guide-steward',name:'Guide Strategy Editor',agentClass:'guide-steward',groups:['editorial-team','agent'],topics:['guide','editorial','cooperative-decisions'],purpose:'Decide what the Guide should explain next and express that direction as a rigorous, evidence-backed editorial plan.',body:'# Guide Strategy Editor\n\nConverts verified editorial evidence into decision-ready plans for developing the TreeSeed Guide as one coherent book.\n\n## Working stance\n\n- Choose one bounded reader problem.\n- Preserve exact evidence and governance lineage.\n- Ask focused questions when authority is missing.\n\n> Human governance remains the final authority.',commonInstructions:'## Shared operating context\n\nPreserve human governance and distinguish evidence from inference. Use TreeDX for content access, retain exact revision lineage, and ask a linked question when authority or evidence is incomplete.'};
const sharedQueries=[{label:'Guide architecture',target:'TreeSeed Guide architecture and editorial decisions',relations:['related','references','parent'],depth:2,limit:8,budget:6000},{label:'Governance lineage',target:'proposal decision estimate governance lineage',relations:['depends_on','references'],depth:1,limit:6,budget:3200}],savedQueries=sharedQueries.map(q=>({...q,relations:[...q.relations]}));
const tabs=[['input','Input'],['relation','Relation'],['projection','Projection'],['output','Output'],['performance','Performance']],state={scope:'identity',tab:'input',provider:'Codex',changes:['Identity · purpose','Planning / Codex · evidence filter'],redo:[],published:'91c4a07',publishedNow:false,outputScenario:'completed',recommendation:false,editorModes:{purpose:'rich',description:'rich',commonInstructions:'rich'},lastFocus:null};
const help={identity:['Agent identity','Agent authoring','The handle is the stable conversational name. The human-readable name labels the agent. Agent class participates in project allocation and assignment matching. Choose an existing class or type a new class identifier; a new class still needs allocation policy before it can receive work.',['Agent definitions','Agent classes and allocation']],groups:['Groups and topics','Agent classification','Groups affect evidence filtering and coordination. Topics connect the agent to relevant discussion and knowledge without granting execution authority.',['Groups and membership','Discussion context']],document:['Agent content document','Content authoring','Both fields use the shared rich Markdown editor. The internal purpose guide is serialized to identity.purpose in frontmatter. The external profile is the MDX document body shown wherever people inspect the agent.',['Agent content model','Rich Markdown editor']],common:['Common context','Agent inheritance','Common instructions and every query listed here are automatically inherited by all enabled activity profiles. Profile Relation settings may add narrower context.',['Agent context contracts','Context inheritance']],query:['TreeDX context query','Portable graph context','The form exposes the parameters currently shared by TreeDX and the TreeSeed SDK. Give a query a short label to save it for reuse. Natural-language text or an exact @node ID provides the most portable target.',['TreeDX ctx syntax','Saved context queries']],profiles:['Fixed activity profiles','Agent runtime','TreeSeed supports Planning, Estimating, Acting, Reviewing, Reporting, and Chat. They are fixed runtime purposes; an agent enables and configures them rather than creating new kinds.',['Activity-profile runtime','Planning and acting modes']],providers:['Eligible providers','Assignment matching','These are compatible execution providers. The control plane selects one for each assignment using capability, availability, allocation, and policy evidence.',['Execution providers','Assignment function']],input:['Input','Activity configuration','Signals select causal evidence; instructions describe how this profile processes an admitted assignment.',['Signal contracts','Prompt configuration']],relation:['Relation','Activity configuration','Retrieval decides which authorized context to assemble. Content permissions independently define what may be read or changed.',['TreeDX context','Content access policy']],projection:['Projection','Activity configuration','Tools and plan structure describe permitted action. Assignment scope and capacity remain control-plane authority.',['Tool mediation','Assignment authority']],output:['Output','Activity configuration','Messages, summaries, durable artifacts, and continuation proposals are distinct validated outputs.',['Output contracts','Continuation behavior']],performance:['Performance','Observed evidence','Metrics are segmented by profile, provider, and published revision. Recommendations become explicit draft changes only after review.',['Agent telemetry','Configuration evaluation']],simulator:['Agent Simulator','Simulation','Open the existing seed-backed Agent Simulator with this agent, selected profile, provider eligibility, and draft or published revision. Simulator evidence returns to the agent lifecycle; this editor does not implement a second test runner.',['Agent Simulator','Seeds and scenarios']]};
function helpButton(id,label='Open contextual help'){return `<button class="help-trigger" data-help="${id}" aria-label="${label}" aria-haspopup="dialog">?</button>`}
function fieldLabel(text,helpId){return `<span class="field-label">${text}${helpId?helpButton(helpId,`Help with ${text}`):''}</span>`}
function fieldFeedback(changed=false){return changed?'<span class="field-feedback">● Changed from published</span><span class="field-diff">Published value remains active until this draft is published.</span>':''}
function markChange(label){if(!state.changes.includes(label))state.changes.unshift(label);state.publishedNow=false;$('#saveState').textContent='Saving…';setTimeout(()=>{const n=$('#saveState');if(n)n.textContent='Autosaved'},350);renderHeader();renderScope();renderStatus()}
function renderHeader(){const pill=$('#statusPill');if(state.changes.length){pill.className='status-pill';pill.textContent=`Draft · ${state.changes.length} change${state.changes.length===1?'':'s'}`;$('#publish').disabled=false}else{pill.className='status-pill published';pill.textContent=`Published · ${state.published}`;$('#publish').disabled=true}}
function renderScope(){const rows=Object.entries(profiles).map(([id,p])=>`<button class="scope-item ${state.scope===id?'active':''}" style="--scope-color:${p.color}" data-scope="${id}" aria-current="${state.scope===id?'page':'false'}"><i></i><span><b>${p.label}</b><small>${p.job}</small></span><output class="${state.changes.some(x=>x.startsWith(p.label))?'changed':''}">${state.changes.some(x=>x.startsWith(p.label))?'draft':'ready'}</output></button>`).join('');$('#scopeRail').innerHTML=`<div class="scope-label">Agent</div><button class="scope-item ${state.scope==='identity'?'active':''}" data-scope="identity"><i></i><span><b>Identity &amp; purpose</b><small>Agent content</small></span><output class="${state.changes.some(x=>x.startsWith('Identity'))?'changed':''}">${state.changes.some(x=>x.startsWith('Identity'))?'draft':'ready'}</output></button><button class="scope-item ${state.scope==='principles'?'active':''}" data-scope="principles"><i></i><span><b>Common context</b><small>Shared instructions + queries</small></span><output class="${state.changes.some(x=>x.startsWith('Common context'))?'changed':''}">${state.changes.some(x=>x.startsWith('Common context'))?'draft':'ready'}</output></button><div class="scope-label">Activity profiles ${helpButton('profiles')}</div>${rows}`}
function tokens(label,items,key){return `<div class="field wide">${fieldLabel(label,key==='groups'?'groups':null)}<div class="tokens">${items.map(x=>`<span class="token">${x}<button data-remove-token="${key}:${x}" aria-label="Remove ${x}">×</button></span>`).join('')}<button class="add-token" data-add-token="${key}">＋ Add</button></div>${fieldFeedback(false)}</div>`}
function renderMarkdown(value){return escapeHtml(value).replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.+)$/gm,'<div>• $1</div>').replace(/\n\n/g,'<br><br>')}
function richEditor(id,label,description,value,storage,changeLabel=`Identity · ${id}`,helpId='document'){const rich=state.editorModes[id]==='rich';return `<section class="rich-field"><div class="rich-field-head"><div><h3>${label} ${helpButton(helpId,`Help with ${label}`)}</h3><p>${description}</p></div><span class="storage-note"><b>Stored in</b> ${storage}</span></div><div class="rich-editor"><div class="rich-toolbar" role="toolbar" aria-label="${label} formatting"><button class="rich-tool mode" data-editor-mode="${id}:rich" aria-pressed="${rich}">Rich text</button><button class="rich-tool mode" data-editor-mode="${id}:source" aria-pressed="${!rich}">Source</button><span class="rich-rule"></span><button class="rich-tool" data-format="undo" aria-label="Undo in ${label}" title="Undo">↶</button><button class="rich-tool" data-format="redo" aria-label="Redo in ${label}" title="Redo">↷</button><select class="rich-tool" aria-label="Block style"><option>Paragraph</option><option>Heading 2</option><option>Quote</option></select><button class="rich-tool" data-format="bold" aria-label="Bold"><b>B</b></button><button class="rich-tool" data-format="italic" aria-label="Italic"><i>I</i></button><button class="rich-tool" data-format="insertUnorderedList" aria-label="Bulleted list">• List</button><button class="rich-tool" data-format="createLink" aria-label="Create link">Link</button><button class="rich-tool" data-format="insertHorizontalRule" aria-label="Insert divider">—</button><span class="rich-source">RichMarkdownEditor</span></div>${rich?`<div class="rich-surface" data-editor="${id}" data-change="${changeLabel}" data-required role="textbox" aria-label="${label}" aria-multiline="true" contenteditable="true">${renderMarkdown(value)}</div>`:`<textarea class="rich-source-editor" data-editor="${id}" data-change="${changeLabel}" data-required aria-label="${label} Markdown source">${escapeHtml(value)}</textarea>`}</div>${fieldFeedback(state.changes.includes(changeLabel))}</section>`}
function queryDsl(q){const quote=String(q.target).replaceAll('"','\\"');return `ctx "${quote}" via ${q.relations.join(',')} depth ${q.depth} limit ${q.limit} budget ${q.budget}`}
function queryCard(q,index){const relations=['related','depends_on','implements','references','parent','child','supersedes'];return `<details class="query-card" ${index===0?'open':''}><summary class="query-summary"><div><b>${escapeHtml(q.label||'Untitled query')}</b><code data-query-summary="${index}">${escapeHtml(queryDsl(q))}</code></div></summary><div class="query-body"><div class="query-grid"><label class="field">${fieldLabel('Label','query')}<input value="${escapeHtml(q.label)}" data-query-index="${index}" data-query-field="label" data-required><span class="field-hint">A short name used to save and find this query.</span></label><label class="field span-2">${fieldLabel('Target','query')}<input value="${escapeHtml(q.target)}" data-query-index="${index}" data-query-field="target" data-required><span class="field-hint">Use natural-language seed text or an exact @node ID.</span></label><div class="field span-3">${fieldLabel('Relations','query')}<div class="relation-options">${relations.map(x=>`<label><input type="checkbox" data-query-index="${index}" data-query-relation="${x}" ${q.relations.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><label class="field">${fieldLabel('Depth','query')}<input type="number" min="0" max="3" value="${q.depth}" data-query-index="${index}" data-query-field="depth" data-required></label><label class="field">${fieldLabel('Result limit','query')}<input type="number" min="1" max="50" value="${q.limit}" data-query-index="${index}" data-query-field="limit" data-required></label><label class="field">${fieldLabel('Token budget','query')}<input type="number" min="1" value="${q.budget}" data-query-index="${index}" data-query-field="budget" data-required></label></div><div class="query-dsl" data-query-dsl="${index}">${escapeHtml(queryDsl(q))}</div><div class="query-actions"><button class="action" data-save-query="${index}">Save query</button><button class="action remove-query" data-remove-query="${index}">Remove query</button></div></div></details>`}
function commonView(){const saved=savedQueries.map((q,index)=>`<option value="${index}">${escapeHtml(q.label)}</option>`).join('');return `<div class="canvas-inner"><span class="eyebrow">Agent / inherited</span><div class="page-title"><div><h2>Common context</h2><p>Instructions and knowledge automatically assembled for every activity profile.</p></div>${helpButton('common')}</div><section class="card" style="margin-top:18px">${richEditor('commonInstructions','Common instructions','Stable guidance applied before profile-specific instructions.',identity.commonInstructions,'frontmatter · identity.instructions','Common context · instructions','common')}</section><section class="card" style="margin-top:14px"><div class="card-head"><div><h3>TreeDX context queries</h3><p>Every query below is resolved for every activity profile.</p></div><div class="card-tools"><span class="source">context.queries[]</span>${helpButton('query')}</div></div><div class="query-library"><label class="field">${fieldLabel('Saved queries','query')}<select id="savedQueryPicker"><option value="">Choose by label…</option>${saved}</select></label><button class="action" id="useSavedQuery">Add saved query</button></div><div class="query-list">${sharedQueries.map(queryCard).join('')}</div><button class="action query-add" id="addQuery">＋ Add context query</button></section></div>`}
function identityView(principles=false){if(principles)return commonView();return `<div class="canvas-inner"><span class="eyebrow">Agent</span><div class="page-title"><div><h2>Identity &amp; purpose</h2><p>Define how the agent is addressed, allocated, and understood.</p></div>${helpButton('identity')}</div><section class="card" style="margin-top:18px"><div class="card-head"><div><h3>Identity</h3></div><div class="card-tools"><span class="source">Frontmatter</span>${helpButton('identity')}</div></div><div class="field-grid"><label class="field">${fieldLabel('Handle','identity')}<input value="${identity.handle}" data-change="Identity · handle" data-required>${fieldFeedback(false)}</label><label class="field">${fieldLabel('Human-readable name','identity')}<input value="${identity.name}" data-change="Identity · name" data-required>${fieldFeedback(false)}</label><label class="field wide">${fieldLabel('Agent class','identity')}<input list="agentClassOptions" value="${identity.agentClass}" data-change="Identity · agent class" data-required autocomplete="off"><datalist id="agentClassOptions"><option value="guide-steward"><option value="guide-writing"><option value="technical-verification"><option value="editorial-reporting"></datalist><span class="field-hint">Choose an existing allocation class or type a new identifier.</span>${fieldFeedback(false)}</label>${tokens('Groups',identity.groups,'groups')}${tokens('Topics / discussion spaces',identity.topics,'topics')}</div></section><section class="card" style="margin-top:14px"><div class="card-head"><div><h3>Agent content file</h3><p>Two audiences, one versioned MDX definition.</p></div><div class="card-tools"><span class="source">src/content/agents/editorial/guide-steward.mdx</span>${helpButton('document')}</div></div><div class="content-editors">${richEditor('purpose','Internal purpose guide','What execution providers should understand about the agent’s reason for being.',identity.purpose,'frontmatter · identity.purpose')}${richEditor('description','External profile','What people see when they inspect or encounter this agent.',identity.body,'MDX document body')}</div></section></div>`}
function profileHeader(p){return `<span class="eyebrow">Activity profile / ${p.handler}</span><div class="page-title"><div><h2>${p.label}</h2><p>${p.purpose}</p></div><label class="toggle"><input class="switch" type="checkbox" checked data-change="${p.label} · enabled"> Enabled</label></div><div class="provider-row"><span class="provider-label">Eligible provider ${helpButton('providers')}</span>${p.providers.map(x=>`<button class="provider" data-provider="${x}" aria-pressed="${state.provider===x}">${x} <em>●</em></button>`).join('')}<span class="provider-note">The control plane selects at assignment time.</span></div><div class="cognitive-tabs" role="tablist">${tabs.map(([id,label])=>`<button class="cognitive-tab ${id==='performance'?'performance':''}" style="--tab-color:${p.color}" role="tab" data-tab="${id}" aria-selected="${state.tab===id}">${label}</button>`).join('')}</div>`}
function inputView(p){return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Signals</h3></div><div class="card-tools"><span class="source">Profile</span>${helpButton('input')}</div></div><div class="list">${p.signals.map(s=>`<div class="list-row"><i style="--row-color:${p.color}"></i><span><b>${s}</b><small>Applicable groups · exact subject revision</small></span><select data-change="${p.label} / ${state.provider} · signal"><option>each</option><option>single</option></select></div>`).join('')}</div>${fieldFeedback(state.changes.some(x=>x.startsWith(`${p.label} / ${state.provider} · evidence`)))}</div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Instructions</h3></div><div class="card-tools"><span class="source override">${state.provider}</span>${helpButton('input')}<button class="restore" data-restore="instructions">Restore</button></div></div><label class="field">${fieldLabel('System instruction','input')}<textarea id="systemInstruction" rows="8" data-change="${p.label} / ${state.provider} · instructions">Act as the Guide Strategy Editor. Read exact evidence and governance state through TreeDX. Stay within the admitted assignment and preserve human authority.</textarea>${fieldFeedback(false)}</label></div></section><aside class="card soft"><div class="card-head"><div><h3>Input preview</h3></div><div class="card-tools"><span class="source">Preview</span>${helpButton('input')}</div></div><div class="preview" id="inputPreview"><span class="dim">signal</span> ${p.signals[0]}\n<span class="dim">profile</span> ${p.label.toLowerCase()}\n<span class="dim">provider candidate</span> ${state.provider}\n\n<b>Assignment</b>\nproposal/guide-coherence-24 @ v4</div></aside></div>`}
function relationView(p){const models=['Objective','Note','Question','Proposal','Decision','Knowledge','Book','Agent'];return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Context knowledge</h3></div><div class="card-tools"><span class="source">Profile</span>${helpButton('relation')}</div></div><div class="list"><div class="list-row"><i></i><span><b>Assignment lineage</b><small>Proposal, decision, estimate, and exact snapshot</small></span><small>required</small></div><div class="list-row"><i></i><span><b>TreeSeed Guide</b><small>Affected book nodes and linked evidence</small></span><small>required</small></div><div class="list-row"><i style="--row-color:var(--info)"></i><span><b>Related discussion</b><small>Matching groups and topics</small></span><small>optional</small></div></div>${fieldFeedback(false)}</div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Content access</h3></div><div class="card-tools"><span class="source override">${state.provider}</span>${helpButton('relation')}</div></div><table class="matrix"><thead><tr><th>Model</th><th>Read</th><th>Create</th><th>Update</th><th>Link</th></tr></thead><tbody>${models.map(m=>`<tr><td>${m}</td>${['read','create','update','link'].map((a,j)=>`<td><input type="checkbox" aria-label="${m} ${a}" ${(j===0||(['Note','Question','Proposal'].includes(m)&&j===1)||(['Note','Proposal'].includes(m)&&j===3))?'checked':''} data-change="${p.label} / ${state.provider} · ${m} permission"></td>`).join('')}</tr>`).join('')}</tbody></table>${fieldFeedback(false)}</div></section><aside class="card soft"><div class="card-head"><div><h3>Context preview</h3></div><div class="card-tools"><span class="source">Exact snapshot</span>${helpButton('relation')}</div></div><div class="list"><div class="list-row"><i></i><span><b>proposal/guide-coherence-24@v4</b><small>Assignment subject</small></span><small>required</small></div><div class="list-row"><i></i><span><b>decision/guide-plan-07</b><small>Governance authority</small></span><small>required</small></div><div class="list-row"><i style="--row-color:var(--info)"></i><span><b>discussion/editorial-188</b><small>Topic relevance 0.86</small></span><small>optional</small></div></div></aside></div>`}
function projectionView(p){return `<div class="authority"><strong>§</strong><div><b>The agent estimates work. The control plane owns assignment scope and limits.</b><p>This profile cannot allocate capacity or extend its lease.</p></div></div><div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Tools and plan</h3></div><div class="card-tools"><span class="source">Required policy</span>${helpButton('projection')}</div></div><label class="field">${fieldLabel('Plan structure','projection')}<select data-change="${p.label} / ${state.provider} · plan"><option>Decision-ready editorial plan v3</option><option>Bounded estimate v2</option></select>${fieldFeedback(false)}</label>${['Describe and query content','Read exact TreeDX context','Create linked proposal or note','Validate scoped content'].map((x,i)=>`<label class="check-row"><input type="checkbox" ${i<3?'checked':''} data-change="${p.label} / ${state.provider} · tool ${i}">${x}</label>`).join('')}</div><div class="card continuation" style="margin-top:14px"><div class="card-head"><div><h3>Continuation</h3></div><div class="card-tools"><span class="source override">${state.provider}</span>${helpButton('projection')}</div></div>${['Stop new work when safe completion is unlikely','Preserve completed work and exact references','Propose remaining scope with a revised estimate','Never extend or reinterpret the lease'].map((x,i)=>`<label class="check-row"><input type="checkbox" checked data-change="${p.label} / ${state.provider} · continuation ${i}">${x}</label>`).join('')}${fieldFeedback(false)}</div></section><aside><div class="card soft"><div class="card-head"><div><h3>Plan preview</h3></div><span class="source">Preview</span></div><div class="preview">objective: Improve Guide governance path\nscope: bounded reader journey\nnon_goals: approve or publish\nverification: exact refs retained</div></div><div class="card soft" style="margin-top:14px"><div class="card-head"><div><h3>Continuation preview</h3></div><span class="source">Preview</span></div><div class="preview">status: continuation_required\ncompleted: 3 / 5 deliverables\nremaining_estimate: 420 / 720 / 1080 sec\nauthority_requested: new assignment\nlease_mutation: none</div></div></aside></div>`}
function outputView(p){const previews={completed:'message: Plan v4 is ready for estimation.\nsummary: 5 deliverables · 7 evidence refs\nartifact: proposal/guide-coherence-24@v4',blocked:'message: Work stopped; claim 14 lacks authority.\nartifact: question/source-claim-14',none:'message: No Guide strategy work applies.\nartifact: estimate/guide-steward-na-02',continuation:'message: Current lease cannot safely complete the scope.\nartifact: proposal/continuation-guide-24\nlease_mutation: none'};return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Structures</h3></div><div class="card-tools"><span class="source">Profile</span>${helpButton('output')}</div></div><div class="field-grid"><label class="field">${fieldLabel('Summary template','output')}<select data-change="${p.label} / ${state.provider} · summary"><option>Evidence-backed summary v2</option></select>${fieldFeedback(false)}</label><label class="field">${fieldLabel('Message template','output')}<select data-change="${p.label} / ${state.provider} · message"><option>Governed handoff v3</option></select>${fieldFeedback(false)}</label></div></div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Artifact contract</h3></div><div class="card-tools"><span class="source override">${state.provider}</span>${helpButton('output')}</div></div><div class="list"><div class="list-row"><i></i><span><b>Proposal or linked note</b><small>Exact subject, evidence, and revision</small></span><small>required</small></div><div class="list-row"><i style="--row-color:var(--violet)"></i><span><b>Continuation proposal</b><small>Only when completion is unsafe</small></span><small>conditional</small></div></div>${fieldFeedback(false)}</div></section><aside class="card soft"><div class="card-head"><div><h3>Result preview</h3></div><span class="source">Preview</span></div><div class="scenario-tabs">${Object.keys(previews).map(x=>`<button class="scenario-tab" data-output="${x}" aria-pressed="${state.outputScenario===x}">${x==='none'?'Not applicable':x}</button>`).join('')}</div><div class="preview" id="outputPreview">${previews[state.outputScenario]}</div></aside></div>`}
function performanceView(p){const metrics=[['Estimate calibration','92%'],['Completion rate','87%'],['Continuation rate','18%'],['Human correction','9%'],['Plan acceptance','81%'],['Tool success','98%'],['Artifact acceptance','94%'],['First useful action','1m 42s']];return `<div class="card soft"><div class="card-head"><div><h3>Observed performance</h3><p>${p.label} · ${state.provider} · ${state.published} · 30 days</p></div><div class="card-tools"><span class="source">Read only</span>${helpButton('performance')}</div></div><div class="metric-grid">${metrics.map((m,i)=>`<div class="metric"><small>${m[0]}</small><b>${m[1]}</b><div class="bar" style="--value:${55+i*5}%;--row-color:${p.color}"><i></i></div></div>`).join('')}</div></div><section class="recommendation"><span class="eyebrow">Recommendation</span><h3>Close required context before tool use</h3><p>Late optional retrieval correlates with continuation.</p><button class="action" id="reviewRecommendation">Review at affected field</button>${state.recommendation?'<button class="action primary" id="applyRecommendation">Apply draft change</button>':''}</section>`}
function renderCanvas(){if(state.scope==='identity'||state.scope==='principles')$('#canvas').innerHTML=identityView(state.scope==='principles');else{const p=profiles[state.scope],body=state.tab==='input'?inputView(p):state.tab==='relation'?relationView(p):state.tab==='projection'?projectionView(p):state.tab==='output'?outputView(p):performanceView(p);$('#canvas').innerHTML=`<div class="canvas-inner">${profileHeader(p)}${body}</div>`}$('#canvas').scrollTop=0}
function renderStatus(){$('#statusColumn').innerHTML=`<section class="status-card"><h3>${state.changes.length?'Unpublished draft':'Published definition'}</h3><div class="status-fact"><span>Published revision</span><b>${state.published}</b></div><div class="status-fact"><span>Draft changes</span><b>${state.changes.length}</b></div><div class="status-fact"><span>Active assignments</span><b>Keep prior revision</b></div>${state.publishedNow?'<p>Published successfully. Further edits begin a new draft.</p>':'<p>Publishing creates an immutable definition version. The editor remains open.</p>'}</section><section class="simulator-card"><div class="card-head"><div><h3>Agent Simulator</h3><p>Use the existing seed-backed simulator.</p></div>${helpButton('simulator')}</div><label>Seed<select id="simulatorSeed"><option>treeseed</option><option>engineering</option><option>research</option></select></label><label>Definition<select id="simulatorRevision"><option>${state.changes.length?'Current draft':'Published '+state.published}</option><option>Published ${state.published}</option></select></label><button class="action" id="openSimulator">Open simulator</button></section>`}
function renderAll(){renderHeader();renderScope();renderCanvas();renderStatus()}
function openHelp(id){const item=help[id]||help.identity;state.lastFocus=document.activeElement;$('#helpTitle').textContent=item[0];$('#helpContext').textContent=item[1];$('#helpBody').innerHTML=`<p>${item[2]}</p><h3>Related documentation</h3><div class="help-links">${item[3].map(x=>`<button>${x} →</button>`).join('')}</div>`;$('#helpDialog').classList.add('open');$('#helpClose').focus()}
function closeHelp(){$('#helpDialog').classList.remove('open');state.lastFocus?.focus()}
function toast(message){const node=$('#toast');node.textContent=message;node.classList.add('show');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.remove('show'),2200)}
function validateControl(control){const value=(control.value??control.innerText??'').trim(),field=control.closest('.field,.rich-field'),required=control.hasAttribute('data-required'),scope=control.dataset.queryField==='scope',invalid=(required&&!value)||(scope&&value&&!value.startsWith('/'))||(control.matches('input[type=number]')&&!control.checkValidity()),message=!value?'This field is required.':scope?'TreeDX path scopes must start with /.':'Enter a value within the supported range.';control.setAttribute('aria-invalid',String(invalid));field?.querySelector('.rich-editor')?.classList.toggle('invalid',invalid);let error=field?.querySelector('.field-error');if(invalid&&!error){error=document.createElement('span');error.className='field-error';field?.append(error)}if(error){error.textContent=message;error.hidden=!invalid}return !invalid}
function refreshQuery(index){const q=sharedQueries[index],card=$$(`.query-card`)[index];if(!q||!card)return;card.querySelector('.query-summary b').textContent=q.label||'Untitled query';card.querySelector('[data-query-summary]').textContent=queryDsl(q);card.querySelector('[data-query-dsl]').textContent=queryDsl(q)}
function updateQueryControl(control){const index=Number(control.dataset.queryIndex),q=sharedQueries[index];if(!q)return;if(control.dataset.queryRelation){q.relations=control.checked?[...new Set([...q.relations,control.dataset.queryRelation])]:q.relations.filter(x=>x!==control.dataset.queryRelation);const host=control.closest('.field'),invalid=q.relations.length===0;host.querySelector('.relation-options').style.borderColor=invalid?'var(--danger)':'#91b598';let error=host.querySelector('.field-error');if(invalid&&!error){error=document.createElement('span');error.className='field-error';host.append(error)}if(error){error.textContent='Select at least one graph relation.';error.hidden=!invalid}}else{const key=control.dataset.queryField,value=control.type==='checkbox'?control.checked:control.type==='number'?Number(control.value):control.value;q[key]=value;validateControl(control)}refreshQuery(index);markChange('Common context · TreeDX queries')}
document.addEventListener('click',e=>{const scope=e.target.closest('[data-scope]');if(scope){state.scope=scope.dataset.scope;renderAll();$('#scopeRail').classList.remove('open')}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;renderCanvas();renderStatus()}const provider=e.target.closest('[data-provider]');if(provider){state.provider=provider.dataset.provider;renderCanvas();renderStatus()}const output=e.target.closest('[data-output]');if(output){state.outputScenario=output.dataset.output;renderCanvas()}const mode=e.target.closest('[data-editor-mode]');if(mode){const [id,next]=mode.dataset.editorMode.split(':');state.editorModes[id]=next;renderCanvas()}const format=e.target.closest('[data-format]');if(format){const surface=format.closest('.rich-editor')?.querySelector('.rich-surface');if(surface){surface.focus();document.execCommand(format.dataset.format,false,format.dataset.format==='createLink'?'https://treeseed.dev':null);markChange(surface.dataset.change)}}const helpTarget=e.target.closest('[data-help]');if(helpTarget)openHelp(helpTarget.dataset.help);const remove=e.target.closest('[data-remove-token]');if(remove){const key=remove.dataset.removeToken.split(':')[0];remove.closest('.token').remove();markChange(`Identity · ${key}`)}const add=e.target.closest('[data-add-token]');if(add){const value=add.dataset.addToken==='groups'?'planning':'book-architecture',span=document.createElement('span');span.className='token';span.textContent=value;add.parentElement.insertBefore(span,add);markChange(`Identity · ${add.dataset.addToken}`)}const removeQuery=e.target.closest('[data-remove-query]');if(removeQuery){sharedQueries.splice(Number(removeQuery.dataset.removeQuery),1);markChange('Common context · TreeDX queries');renderCanvas();toast('Context query removed')}const saveQuery=e.target.closest('[data-save-query]');if(saveQuery){const q=sharedQueries[Number(saveQuery.dataset.saveQuery)];if(q?.label.trim()){const saved={...q,relations:[...q.relations]},existing=savedQueries.findIndex(item=>item.label===q.label);existing<0?savedQueries.push(saved):savedQueries.splice(existing,1,saved);renderCanvas();toast(`Saved “${q.label}” for reuse`)}}if(e.target.id==='useSavedQuery'){const raw=$('#savedQueryPicker').value,index=raw===''?-1:Number(raw),q=savedQueries[index];if(!q)toast('Choose a saved query');else if(sharedQueries.some(item=>item.label===q.label))toast(`“${q.label}” is already in Common context`);else{sharedQueries.push({...q,relations:[...q.relations]});markChange('Common context · TreeDX queries');renderCanvas();toast(`Added “${q.label}” to Common context`)}}if(e.target.id==='addQuery'){sharedQueries.push({label:'',target:'',relations:['related','references'],depth:1,limit:8,budget:1800});markChange('Common context · TreeDX queries');renderCanvas();const label=$$('[data-query-field=label]').at(-1);label.closest('details').open=true;validateControl(label);label.focus();toast('Context query added')}const restore=e.target.closest('[data-restore]');if(restore){markChange(`${profiles[state.scope].label} / ${state.provider} · inherited instructions`);toast('Inherited value restored')}if(e.target.id==='reviewRecommendation'){state.recommendation=true;state.tab='relation';renderCanvas();toast('Recommendation opened at Context knowledge')}if(e.target.id==='applyRecommendation'){markChange(`${profiles[state.scope].label} / ${state.provider} · required context closure`);renderCanvas();toast('Draft change applied')}if(e.target.id==='undo'){const item=state.changes.shift();if(item)state.redo.unshift(item);renderAll();toast(item?'Change undone':'Nothing to undo')}if(e.target.id==='redo'){const item=state.redo.shift();if(item)state.changes.unshift(item);renderAll();toast(item?'Change restored':'Nothing to redo')}if(e.target.id==='publish'){state.published='b72fd91';state.changes=[];state.redo=[];state.publishedNow=true;renderAll();toast('Published b72fd91 · next edit starts a new draft')}if(e.target.id==='openSimulator')toast(`Opening Agent Simulator · ${$('#simulatorSeed').value} seed · ${profiles[state.scope]?.label||'agent'} context`);if(e.target.id==='closeDesigner')location.href='agent-lab.html';if(e.target.id==='scopeToggle')$('#scopeRail').classList.toggle('open');if(e.target.id==='statusToggle')$('#statusColumn').classList.toggle('open')});
document.addEventListener('input',e=>{if(e.target.dataset.change){markChange(e.target.dataset.change);validateControl(e.target)}if(e.target.dataset.queryField||e.target.dataset.queryRelation)updateQueryControl(e.target);if(e.target.dataset.editor==='purpose')identity.purpose=e.target.value??e.target.innerText;if(e.target.dataset.editor==='description')identity.body=e.target.value??e.target.innerText;if(e.target.dataset.editor==='commonInstructions')identity.commonInstructions=e.target.value??e.target.innerText;if(e.target.id==='systemInstruction'){const preview=$('#inputPreview');if(preview)preview.textContent=`provider candidate: ${state.provider}\nprofile: ${state.scope}\n\n${e.target.value}`}});
document.addEventListener('change',e=>{if((e.target.dataset.queryField||e.target.dataset.queryRelation)&&!['text','number'].includes(e.target.type))updateQueryControl(e.target)});
$('#helpClose').onclick=closeHelp;$('#helpDialog').onclick=e=>{if(e.target===$('#helpDialog'))closeHelp()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#helpDialog').classList.contains('open'))closeHelp();else{$('#scopeRail').classList.remove('open');$('#statusColumn').classList.remove('open')}}});renderAll();
</script>
