<section class="overlay" id="overlay" aria-modal="true" role="dialog"><header class="overlay-head"><span class="agent-mark" id="overlayMark">◎</span><div><h2 id="overlayTitle"></h2><p id="overlayMeta"></p></div><button class="overlay-close" id="overlayClose" aria-label="Close">×</button></header><div class="overlay-body" id="overlayBody"></div></section><div class="toast" id="toast" role="status" aria-live="polite"></div></section></main></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const profiles={planning:{label:'Planning',handler:'writer',purpose:'Turn synchronized evidence into a decision-ready editorial proposal.',color:'#3a8587',signals:['evidence-ready','proposal-estimated'],providers:['Codex','OpenCode']},estimating:{label:'Estimating',handler:'estimate',purpose:'Produce an independent, structured estimate that informs allocation.',color:'#9a7425',signals:['proposal-ready'],providers:['Codex','OpenCode']},acting:{label:'Acting',handler:'writer',purpose:'Apply only the exact editorial change authorized by an approved decision.',color:'#4f7d4e',signals:['governed-execution-ready'],providers:['Codex','OpenCode']}};
const identity={name:'Guide Strategy Editor',description:'Converts verified editorial evidence into decision-ready plans for developing the TreeSeed Guide as one coherent book.',purpose:'Decide what the Guide should explain next and express that direction as a rigorous, evidence-backed editorial plan.',responsibilities:['Assess reader and book impact','Select a bounded objective gap','Synthesize research into a complete plan'],limits:['Never approve or vote on its own proposal','Never publish content','Never widen product guarantees'],groups:['editorial-team','guide-steward','agent'],topics:['guide','editorial','cooperative-decisions'],capabilities:['guide-steward.planning','guide-steward.estimating','guide-steward.acting']};
const state={scope:'identity',tab:'input',provider:'Codex',inspect:'inheritance',changes:['Acting / Codex · continuation contract','Planning / Codex · evidence-ready filter','Identity · durable principles'],published:'91c4a07',outputScenario:'completed',testScenario:'planning',testStep:'input',recommendation:false,lastFocus:null};
const tabs=[['input','Input'],['relation','Relation'],['projection','Projection'],['output','Output'],['performance','Performance']],inspectTabs=['inheritance','validation','changes','help'];
function markChange(label){if(!state.changes.includes(label))state.changes.unshift(label);$('#statusPill').textContent=`Draft · ${state.changes.length} change${state.changes.length===1?'':'s'}`;$('#saveState').textContent='Saving…';setTimeout(()=>$('#saveState').textContent='Autosaved just now',450);renderScope();renderInspector()}
function toast(message){const node=$('#toast');node.textContent=message;node.classList.add('show');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.remove('show'),2200)}
function renderScope(){const profileRows=Object.entries(profiles).map(([id,p])=>`<button class="scope-item ${state.scope===id?'active':''}" style="--scope-color:${p.color}" data-scope="${id}" aria-current="${state.scope===id?'page':'false'}"><i></i><span><b>${p.label}</b><small>${p.handler} · ${p.providers.length} providers</small></span><output class="${state.changes.some(x=>x.startsWith(p.label))?'changed':''}">${state.changes.some(x=>x.startsWith(p.label))?'changed':'ready'}</output></button>`).join('');$('#scopeRail').innerHTML=`<div class="scope-label">Agent foundation</div><button class="scope-item ${state.scope==='identity'?'active':''}" data-scope="identity"><i></i><span><b>Identity &amp; purpose</b><small>Shared across all activity</small></span><output class="${state.changes.some(x=>x.startsWith('Identity'))?'changed':''}">${state.changes.some(x=>x.startsWith('Identity'))?'changed':'ready'}</output></button><button class="scope-item ${state.scope==='principles'?'active':''}" data-scope="principles"><i></i><span><b>Shared principles</b><small>Durable behavior</small></span><output>ready</output></button><div class="scope-label">Activity profiles</div>${profileRows}<button class="add-scope" id="addProfile">＋ Add activity profile</button><div class="purpose-mini"><small>Purpose held in view</small><p>Decide what the Guide should explain next.</p><span>Evidence-backed direction with human governance preserved.</span></div>`}
function tokenField(label,items,key){return `<div class="field wide"><span>${label}</span><div class="tokens">${items.map(x=>`<span class="token">${x}<button aria-label="Remove ${x}" data-remove-token="${key}:${x}">×</button></span>`).join('')}<button class="add-token" data-add-token="${key}">＋ Add</button></div></div>`}
function identityView(principles=false){if(principles)return `<div class="canvas-inner"><span class="eyebrow">Agent foundation / shared</span><div class="page-title"><div><h2>Shared principles</h2><p>Durable expectations inherited by every activity profile and eligible execution provider.</p></div></div><div class="panel-grid wide-left"><section class="card"><div class="card-head"><div><h3>Durable instructions</h3><p>These principles cannot grant authority beyond an assignment.</p></div><span class="source">Agent definition</span></div><label class="field"><span>Instructions</span><textarea rows="12" data-change="Identity · durable principles">Preserve human governance. Distinguish evidence from inference. Use TreeDX for all content access. Never approve or vote on your own proposal. Ask a linked question when evidence is incomplete. Stay within the assigned activity profile and exact governed scope.</textarea></label></section><aside class="card soft"><div class="card-head"><div><h3>Inheritance preview</h3><p>How these principles reach an execution.</p></div></div><div class="list"><div class="list-row"><i></i><span><b>Agent identity</b><small>Purpose and durable instructions</small></span><small>base</small></div><div class="list-row"><i></i><span><b>Activity profile</b><small>Mode-specific behavior and permissions</small></span><small>merge</small></div><div class="list-row"><i></i><span><b>Provider override</b><small>Execution-provider realization</small></span><small>last</small></div><div class="list-row"><i style="--row-color:var(--info)"></i><span><b>Assignment envelope</b><small>Scope and limits supplied by control plane</small></span><small>authority</small></div></div></aside></div></div>`;return `<div class="canvas-inner"><span class="eyebrow">Agent foundation</span><div class="page-title"><div><h2>Identity &amp; purpose</h2><p>Define why this agent exists before specializing how it perceives, relates, projects, and communicates.</p></div><label class="toggle"><input class="switch" type="checkbox" checked data-change="Identity · enabled"> Enabled</label></div><div class="panel-grid wide-left"><section class="card"><div class="card-head"><div><h3>Identity contract</h3><p>Human-readable identity and organizational placement.</p></div><span class="source override">1 override</span></div><div class="field-grid"><label class="field"><span>Name</span><input value="${identity.name}" data-change="Identity · name"></label><label class="field"><span>Agent class</span><input value="guide-steward" readonly></label><label class="field wide"><span>Description</span><textarea rows="3" data-change="Identity · description">${identity.description}</textarea></label><label class="field wide"><span>Purpose</span><textarea rows="3" data-change="Identity · purpose">${identity.purpose}</textarea></label>${tokenField('Responsibilities',identity.responsibilities,'responsibilities')}${tokenField('Explicit non-responsibilities',identity.limits,'limits')}</div></section><aside class="card soft"><div class="card-head"><div><h3>Organization</h3><p>Discovery and discussion relationships.</p></div><span class="source">Shared</span></div><div class="field-grid">${tokenField('Groups',identity.groups,'groups')}${tokenField('Topics / discussion spaces',identity.topics,'topics')}${tokenField('Capabilities',identity.capabilities,'capabilities')}</div></aside></div></div>`}
function profileHeader(id,p){return `<span class="eyebrow">Activity profile / ${p.handler}</span><div class="page-title"><div><h2>${p.label}</h2><p>${p.purpose}</p></div><label class="toggle"><input class="switch" type="checkbox" checked data-change="${p.label} · enabled"> Enabled</label></div><div class="provider-row"><span class="provider-label">Eligible provider</span>${p.providers.map(x=>`<button class="provider" data-provider="${x}" aria-pressed="${state.provider===x}">${x} <em>● compatible</em></button>`).join('')}<button class="provider-add" id="addProvider" aria-label="Add eligible provider">＋</button><span class="provider-note">Eligibility is declared here; selection is assignment-time control-plane policy.</span></div><div class="cognitive-tabs" role="tablist" aria-label="Agent cognition">${tabs.map(([key,label])=>`<button class="cognitive-tab ${key==='performance'?'performance':''}" style="--tab-color:${p.color}" role="tab" data-tab="${key}" aria-selected="${state.tab===key}">${label}</button>`).join('')}</div>`}
function inputView(p){const signals=p.signals.map((s,i)=>`<div class="list-row"><i style="--row-color:${p.color}"></i><span><b>${s}</b><small>${i?'Every matching proposal · all producers':'Group intersects editorial-team · all producers'}</small></span><select aria-label="Cardinality for ${s}" data-change="${p.label} / ${state.provider} · ${s} filter"><option>each</option><option>single</option></select></div>`).join('');return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Signal intake</h3><p>Events and governance transitions this provider may perceive.</p></div><span class="source">Profile template</span></div><div class="list" id="signalList">${signals}</div><button class="add-scope" id="addSignal" style="margin-top:8px">＋ Add signal subscription</button><div class="field-grid" style="margin-top:14px"><label class="field"><span>Eligibility</span><select data-change="${p.label} / ${state.provider} · eligibility"><option>Applicable group + open objective</option><option>Explicit mention only</option></select></label><label class="field"><span>Suppress when</span><select data-change="${p.label} / ${state.provider} · suppression"><option>Equivalent artifact already exists</option><option>Never</option></select></label></div></div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Unmodified instructions</h3><p>Applied before contextual interpretation.</p></div><span><span class="source override">${state.provider} override</span> <button class="restore" data-restore="Input instructions">Restore inherited</button></span></div><label class="field"><span>System instruction</span><textarea id="systemInstruction" rows="7" data-change="${p.label} / ${state.provider} · instructions">Act as the TreeSeed Guide strategy editor. Read exact evidence and governance state through TreeDX. Produce work scoped to the selected objective and preserve human authority.</textarea></label><label class="field" style="margin-top:10px"><span>Assignment task framing</span><textarea rows="3" data-change="${p.label} / ${state.provider} · task">Create one substantive, evidence-supported contribution for the exact assignment.</textarea></label></div></section><aside><div class="card soft"><div class="card-head"><div><h3>Assembled input</h3><p>Representative envelope · updates with instructions.</p></div><span class="source">Preview</span></div><div class="preview" id="inputPreview"><span class="dim">signal</span> ${p.signals[0]}\n<span class="dim">profile</span> ${p.label.toLowerCase()}\n<span class="dim">provider candidate</span> ${state.provider}\n<span class="dim">groups</span> editorial-team, guide-steward\n\n<b>Instruction</b>\nAct as the TreeSeed Guide strategy editor.\n\n<b>Assignment</b>\nproposal/guide-coherence-24 @ immutable v4</div></div><div class="card accent" style="margin-top:14px"><h3>Instruction precedence</h3><div class="list" style="margin-top:10px"><div class="list-row"><i></i><span><b>1 · Governance and assignment</b><small>Cannot be overridden here</small></span></div><div class="list-row"><i></i><span><b>2 · Shared principles</b><small>Inherited from agent</small></span></div><div class="list-row"><i></i><span><b>3 · Profile and provider</b><small>Selected configuration</small></span></div></div></div></aside></div>`}
function relationView(p){const models=['Objective','Note','Question','Proposal','Decision','Knowledge','Book','Agent'];return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Context knowledge</h3><p>Retrieval describes what to assemble, not what is authorized.</p></div><span class="source">Profile template</span></div><div class="list"><div class="list-row"><i></i><span><b>Exact assignment lineage</b><small>Proposal, decision, estimate, and assignment snapshot</small></span><small>required</small></div><div class="list-row"><i></i><span><b>TreeSeed Guide knowledge</b><small>Affected book nodes and linked evidence</small></span><small>required</small></div><div class="list-row"><i style="--row-color:var(--info)"></i><span><b>Related discussion</b><small>Same groups and topic, newest accepted revision first</small></span><small>optional</small></div></div><div class="field-grid" style="margin-top:14px"><label class="field"><span>Retrieval order</span><select data-change="${p.label} / ${state.provider} · retrieval"><option>Authority → relevance → recency</option></select></label><label class="field"><span>Freshness</span><select data-change="${p.label} / ${state.provider} · freshness"><option>Exact assignment snapshot</option></select></label></div></div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Content access</h3><p>Authorization remains independent of retrieval.</p></div><span class="source override">Provider override</span></div><table class="matrix"><thead><tr><th>Model</th><th>Read</th><th>Create</th><th>Update</th><th>Link</th></tr></thead><tbody>${models.map((m,i)=>`<tr><td>${m}</td>${[0,1,2,3].map((_,j)=>`<td><input type="checkbox" aria-label="${m} ${['read','create','update','link'][j]}" ${(j===0||(['Note','Question','Proposal'].includes(m)&&j===1)||(['Note','Proposal'].includes(m)&&j===3))?'checked':''} data-change="${p.label} / ${state.provider} · ${m} permission"></td>`).join('')}</tr>`).join('')}</tbody></table><label class="field" style="margin-top:12px"><span>Allowed write paths</span><input value="src/content/{notes,questions,proposals}/editorial/**" data-change="${p.label} / ${state.provider} · paths"></label><label class="check-row"><input type="checkbox" checked data-change="${p.label} / ${state.provider} · commit permission">Allow validated TreeDX content commit inside assignment scope</label></div></section><aside class="card soft"><div class="card-head"><div><h3>Context assembly</h3><p>Why each representative item was selected.</p></div><span class="source">Preview</span></div><div class="list"><div class="list-row"><i></i><span><b>proposal/guide-coherence-24@v4</b><small>Exact assignment subject</small></span><small>required</small></div><div class="list-row"><i></i><span><b>decision/guide-plan-07</b><small>Governance authority</small></span><small>required</small></div><div class="list-row"><i></i><span><b>book/treeseed-guide</b><small>Affected hierarchy</small></span><small>required</small></div><div class="list-row"><i style="--row-color:var(--info)"></i><span><b>discussion/editorial-188</b><small>Topic relevance 0.86</small></span><small>optional</small></div></div><div class="preview" style="margin-top:12px"><span class="dim">retrieval</span> 4 items / exact snapshot\n<span class="dim">permission</span> 4 reads authorized\n<span class="dim">omitted</span> 2 stale notes, 1 unrelated decision\n\n<b>Context digest</b>\nctx_8b43…f901</div></aside></div>`}
function projectionView(p){return `<div class="authority"><strong>§</strong><div><b>The agent estimates work. The control plane determines assignment scope, reservation, lease deadline, and execution limits.</b><p>This configuration cannot extend a lease, allocate capacity, select itself for work, or reinterpret assignment authority.</p></div></div><div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Authorized projection</h3><p>Capabilities available only inside an admitted assignment.</p></div><span class="source">Required policy</span></div><div class="field-grid"><label class="field"><span>Plan structure</span><select data-change="${p.label} / ${state.provider} · plan template"><option>Decision-ready editorial plan v3</option><option>Bounded estimate v2</option></select></label><label class="field"><span>Escalation</span><select data-change="${p.label} / ${state.provider} · escalation"><option>Create linked blocking question</option></select></label></div><div class="list" style="margin-top:12px">${['Describe and query content','Read exact TreeDX context','Create linked proposal or note','Validate and commit scoped content'].map((x,i)=>`<label class="check-row"><input type="checkbox" ${i<3?'checked':''} data-change="${p.label} / ${state.provider} · tool ${i}">${x}</label>`).join('')}</div></div><div class="card continuation" style="margin-top:14px"><div class="card-head"><div><h3>Continuation contract</h3><p>Preserve useful work before assignment authority expires.</p></div><span class="source override">${state.provider} override</span></div>${['Monitor assignment-provided remaining time and completion evidence','Stop beginning new work when safe completion is no longer likely','Preserve completed work and exact references','Propose remaining scope with revised min / expected / max estimate','Never self-extend, renew, or reinterpret the lease','Resume only through a later authorized assignment'].map((x,i)=>`<label class="check-row"><input type="checkbox" checked data-change="${p.label} / ${state.provider} · continuation ${i}">${x}</label>`).join('')}</div></section><aside><div class="card soft"><div class="card-head"><div><h3>Structured plan</h3><p>Reusable template preview.</p></div><span class="source">Preview</span></div><div class="preview">objective: Improve Guide governance path\nscope:\n  - map reader entry state\n  - reconcile approved evidence\nnon_goals:\n  - approve proposal\n  - publish content\nverification:\n  - exact refs retained\n  - linked questions resolved</div></div><div class="card soft" style="margin-top:14px"><div class="card-head"><div><h3>Continuation proposal</h3><p>Generated before shutdown; never extends the lease.</p></div><span class="source">Preview</span></div><div class="preview">status: continuation_required\ncompleted: 3 / 5 deliverables\nremaining: navigation reconciliation\nrevised_estimate:\n  min: 420 agent-seconds\n  expected: 720 agent-seconds\n  max: 1080 agent-seconds\nauthority_requested: new assignment\nlease_mutation: none</div></div></aside></div>`}
function outputView(p){const previews={completed:'message: Editorial plan v4 is ready for independent estimation.\nsummary: 5 deliverables · 7 evidence refs · 2 open questions\nartifacts: proposal/guide-coherence-24@v4\nsignal: proposal-ready',blocked:'message: Work stopped because claim 14 lacks primary authority.\nsummary: Safe partial analysis preserved.\nartifact: question/source-claim-14\nsignal: blocked',none:'message: This proposal does not require Guide strategy work.\nsummary: Structured not-applicable rationale recorded.\nartifacts: estimate/guide-steward-na-02',continuation:'message: Authorized scope cannot finish safely in the current lease.\nsummary: Completed work preserved; remaining work estimated.\nartifact: proposal/continuation-guide-24\nlease_mutation: none'};return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Communication structures</h3><p>Human message, structured summary, and artifacts remain separate.</p></div><span class="source">Profile template</span></div><div class="field-grid"><label class="field"><span>Summary template</span><select data-change="${p.label} / ${state.provider} · summary template"><option>Evidence-backed work summary v2</option></select></label><label class="field"><span>Message template</span><select data-change="${p.label} / ${state.provider} · message template"><option>Concise governed handoff v3</option></select></label><label class="field wide"><span>Audience and tone</span><input value="Strategic, editorially coherent, governance-aware" data-change="${p.label} / ${state.provider} · tone"></label></div></div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Artifact contract</h3><p>Durable outputs validated before completion.</p></div><span class="source override">Provider override</span></div><div class="list"><div class="list-row"><i></i><span><b>Proposal or linked note</b><small>Exact subject, evidence, assumptions, and revision</small></span><small>required</small></div><div class="list-row"><i></i><span><b>Evidence references</b><small>Stable content paths or refs</small></span><small>required</small></div><div class="list-row"><i style="--row-color:var(--violet)"></i><span><b>Continuation proposal</b><small>Required only when completion is unsafe</small></span><small>conditional</small></div></div></div></section><aside class="card soft"><div class="card-head"><div><h3>Rendered result</h3><p>Representative outcome.</p></div><span class="source">Preview</span></div><div class="scenario-tabs">${Object.keys(previews).map(x=>`<button class="scenario-tab" data-output="${x}" aria-pressed="${state.outputScenario===x}">${x==='none'?'Not applicable':x}</button>`).join('')}</div><div class="preview" id="outputPreview">${previews[state.outputScenario]}</div></aside></div>`}
function performanceView(p){const metrics=[['Estimate calibration','92%','+4%'],['Completion rate','87%','+3%'],['Continuation rate','18%','+6%'],['Human correction','9%','−2%'],['Plan acceptance','81%','+7%'],['Tool success','98%','stable'],['Artifact acceptance','94%','+2%'],['First useful action','1m 42s','−18s']];return `<div class="card soft"><div class="card-head"><div><h3>Observed performance</h3><p>${p.label} · ${state.provider} · published ${state.published} · last 30 days</p></div><span class="source">Read-only evidence</span></div><div class="metric-grid">${metrics.map((m,i)=>`<div class="metric"><small>${m[0]}</small><b>${m[1]}</b><span>${m[2]}</span><div class="bar" style="--value:${55+i*5}%;--row-color:${p.color}"><i></i></div></div>`).join('')}</div></div><div class="panel-grid"><section class="recommendation"><span class="eyebrow">Reviewable recommendation</span><h3>Late context expansion correlates with continuation</h3><p>Acting assignments often retrieve optional discussion after tool execution begins. Consider requiring authority-first context closure before the first mutation plan.</p><button class="action" id="reviewRecommendation">Review proposed diff</button>${state.recommendation?'<button class="action primary" id="applyRecommendation">Apply to draft</button>':''}</section><section class="card"><div class="card-head"><div><h3>Provider comparison</h3><p>Comparable outcomes; routing remains control-plane owned.</p></div></div><div class="list"><div class="list-row"><i></i><span><b>Codex</b><small>42 assignments · 87% completed</small></span><small>18% continue</small></div><div class="list-row"><i style="--row-color:var(--info)"></i><span><b>OpenCode</b><small>19 assignments · 84% completed</small></span><small>21% continue</small></div></div></section></div>`}
function renderCanvas(){if(state.scope==='identity'||state.scope==='principles')$('#canvas').innerHTML=identityView(state.scope==='principles');else{const p=profiles[state.scope];const body=state.tab==='input'?inputView(p):state.tab==='relation'?relationView(p):state.tab==='projection'?projectionView(p):state.tab==='output'?outputView(p):performanceView(p);$('#canvas').innerHTML=`<div class="canvas-inner">${profileHeader(state.scope,p)}${body}</div>`}$('#canvas').scrollTop=0}
function renderInspector(){const tabButtons=inspectTabs.map(x=>`<button class="inspector-tab" role="tab" data-inspect="${x}" aria-selected="${state.inspect===x}">${x}</button>`).join('');$('.inspector-tabs').innerHTML=tabButtons;const p=profiles[state.scope];const common={inheritance:`<div class="inspect-section"><h3>Effective source</h3><p>${p?`${p.label} / ${state.provider} / ${state.tab}`:'Agent definition'} combines the published base with visible draft overrides.</p></div><div class="inspect-fact"><span>Agent identity</span><b>inherited</b></div><div class="inspect-fact"><span>Profile template</span><b>inherited</b></div><div class="inspect-fact"><span>Provider realization</span><b>override</b></div><div class="inspect-fact"><span>Assignment limits</span><b>not editable</b></div>`,validation:`<div class="inspect-section"><h3>Configuration health</h3><p>Validation is illustrative and local to this prototype.</p></div><div class="inspect-fact"><span>Governed acting signal</span><b class="valid">valid</b></div><div class="inspect-fact"><span>Write path authority</span><b class="valid">valid</b></div><div class="inspect-fact"><span>Provider capabilities</span><b class="valid">2 / 2</b></div><div class="inspect-fact"><span>Continuation output</span><b class="valid">valid</b></div><div class="inspect-fact"><span>Preview structures</span><b class="valid">4 / 4</b></div>`,changes:`<div class="inspect-section"><h3>${state.changes.length} unpublished changes</h3><p>Draft changes do not affect active assignments.</p></div>${state.changes.length?state.changes.map((x,i)=>`<div class="diff"><b>${x}</b><del>${i?'published value':'optional context'}</del><ins>${i?'draft override':'required before tools'}</ins></div>`).join(''):'<div class="empty">Draft matches published revision.</div>'}`,help:`<div class="inspect-section"><h3>The cognitive model</h3><p><b>Input</b> receives signals and instructions. <b>Relation</b> assembles authorized context. <b>Projection</b> structures intent and governed actions. <b>Output</b> creates durable communication.</p></div><div class="inspect-section"><h3>Authority boundary</h3><p>Provider eligibility belongs to the agent definition. Provider selection, assignment admission, reservations, and leases belong to the control plane.</p></div>`};$('#inspectorBody').innerHTML=common[state.inspect]}
function renderAll(){renderScope();renderCanvas();renderInspector()}
function compareOverlay(){return `<div class="overlay-inner"><span class="eyebrow">Published ${state.published} → current draft</span><div class="page-title"><div><h2>Configuration comparison</h2><p>Every change remains local to this fake draft until publication.</p></div></div><table class="diff-table"><thead><tr><th>Scope</th><th>Published</th><th>Draft</th><th>Impact</th></tr></thead><tbody>${state.changes.map((x,i)=>`<tr><td><b>${x}</b></td><td>${i?'Inherited value':'Optional context closure'}</td><td>${i?'Provider override':'Required before first tool'}</td><td>${i?'Preview remains valid':'Addresses performance recommendation'}</td></tr>`).join('')}</tbody></table></div>`}
const testScenarios={planning:{label:'Planning from evidence-ready',profile:'Planning',provider:'Codex',lease:['900 sec','900 sec','14:22:00','48k tokens','read + content'],result:'proposal-ready'},estimating:{label:'Estimate a proposal',profile:'Estimating',provider:'OpenCode',lease:['480 sec','420 sec','14:12:00','22k tokens','read only'],result:'proposal-estimated'},acting:{label:'Act from governed-execution-ready',profile:'Acting',provider:'Codex',lease:['1200 sec','1080 sec','15:04:00','64k tokens','scoped write'],result:'knowledge-update'},deadline:{label:'Approaching lease deadline',profile:'Acting',provider:'Codex',lease:['1200 sec','52 sec left','14:44:32','8k remain','stop + propose'],result:'continuation-required'}};
function testOverlay(){const s=testScenarios[state.testScenario],steps={input:`signal: ${state.testScenario==='acting'||state.testScenario==='deadline'?'governed-execution-ready':state.testScenario==='estimating'?'proposal-ready':'evidence-ready'}\nsubject: proposal/guide-coherence-24@v4\nprovider selected by controller: ${s.provider}`,relation:'required: proposal v4, decision authority, exact book nodes\noptional: editorial discussion 188\nomitted: stale note revisions\ncontext digest: ctx_8b43…f901',projection:state.testScenario==='deadline'?'remaining time is insufficient for safe completion\nstop beginning new work: yes\npreserve completed artifacts: yes\ncreate continuation proposal: authorized\nrenew or extend lease: denied':'plan template: decision-ready editorial plan v3\ntools: content read, link, validate\ngovernance boundary: passed',output:state.testScenario==='deadline'?'status: continuation_required\ncompleted: 3 / 5 deliverables\nremaining estimate: 420 / 720 / 1080 sec\nartifact: proposal/continuation-guide-24\nlease mutation: none':`status: completed\nsignal: ${s.result}\nvalidation: passed\nartifacts: exact refs retained`};return `<div class="overlay-inner"><div class="test-toolbar"><label for="testScenario">Scenario</label><select id="testScenario">${Object.entries(testScenarios).map(([k,v])=>`<option value="${k}" ${state.testScenario===k?'selected':''}>${v.label}</option>`).join('')}</select><button class="action primary" id="runScenario">Run scenario</button></div><div class="lease-strip">${[['Profile',s.profile],['Requested',s.lease[0]],['Reservation',s.lease[1]],['Hard deadline',s.lease[2]],['Provider authority',s.lease[4]]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="authority"><strong>§</strong><div><b>Read-only assignment envelope</b><p>Created by the fake control plane from estimates and policy. The agent can observe it, but no control in this studio can change it.</p></div></div><div class="test-stepper">${['input','relation','projection','output'].map(x=>`<button class="test-step ${state.testStep===x?'active':''}" data-test-step="${x}">${x}</button>`).join('')}</div><div class="panel-grid"><section class="card"><div class="card-head"><div><h3>${state.testStep[0].toUpperCase()+state.testStep.slice(1)} trace</h3><p>Effective configuration and decision evidence.</p></div><span class="source">Test run</span></div><div class="preview">${steps[state.testStep]}</div></section><aside class="card soft"><div class="card-head"><div><h3>Run evidence</h3><p>${s.provider} · fake execution</p></div><span class="source">Passed</span></div><div class="list"><div class="list-row"><i></i><span><b>Configuration valid</b><small>Published base plus draft overrides</small></span><small>pass</small></div><div class="list-row"><i></i><span><b>Permissions enforced</b><small>No unauthorized tool calls</small></span><small>pass</small></div><div class="list-row"><i style="--row-color:var(--violet)"></i><span><b>${state.testScenario==='deadline'?'Continuation proposed':'Output validated'}</b><small>${state.testScenario==='deadline'?'Lease remained unchanged':s.result}</small></span><small>pass</small></div></div></aside></div></div>`}
function openOverlay(kind){state.lastFocus=document.activeElement;$('#overlayTitle').textContent=kind==='test'?'Agent test studio':'Compare configuration';$('#overlayMeta').textContent=kind==='test'?'Fake execution · no mutation':'Published versus draft';$('#overlayBody').innerHTML=kind==='test'?testOverlay():compareOverlay();$('#overlay').dataset.kind=kind;$('#overlay').classList.add('open');$('#overlayClose').focus()}
function closeOverlay(){$('#overlay').classList.remove('open');state.lastFocus?.focus()}
document.addEventListener('click',e=>{const scope=e.target.closest('[data-scope]');if(scope){state.scope=scope.dataset.scope;if(profiles[state.scope]&&!profiles[state.scope].providers.includes(state.provider))state.provider=profiles[state.scope].providers[0];renderAll();$('#scopeRail').classList.remove('open')}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;renderCanvas();renderInspector()}const provider=e.target.closest('[data-provider]');if(provider){state.provider=provider.dataset.provider;renderCanvas();renderInspector()}const inspect=e.target.closest('[data-inspect]');if(inspect){state.inspect=inspect.dataset.inspect;renderInspector()}const output=e.target.closest('[data-output]');if(output){state.outputScenario=output.dataset.output;renderCanvas()}const overlay=e.target.closest('[data-overlay]');if(overlay)openOverlay(overlay.dataset.overlay);const testStep=e.target.closest('[data-test-step]');if(testStep){state.testStep=testStep.dataset.testStep;$('#overlayBody').innerHTML=testOverlay()}const restore=e.target.closest('[data-restore]');if(restore){markChange(`${profiles[state.scope]?.label||'Agent'} / ${state.provider} · restored inheritance`);toast(`${restore.dataset.restore} restored from profile template`)}const remove=e.target.closest('[data-remove-token]');if(remove){markChange(`Identity · ${remove.dataset.removeToken.split(':')[0]}`);remove.closest('.token').remove()}const add=e.target.closest('[data-add-token]');if(add){const labels={groups:'planning',topics:'book-architecture',capabilities:'guide-steward.reviewing',responsibilities:'Map governance dependencies',limits:'Never invent missing evidence'};const host=add.parentElement,span=document.createElement('span');span.className='token';span.textContent=labels[add.dataset.addToken];host.insertBefore(span,add);markChange(`Identity · ${add.dataset.addToken}`)}if(e.target.id==='addProfile')toast('Profile template chooser opened in this prototype');if(e.target.id==='addProvider')toast('Eligible provider catalog opened');if(e.target.id==='addSignal'){profiles[state.scope].signals.push('proposal-revised');markChange(`${profiles[state.scope].label} / ${state.provider} · signal subscription`);renderCanvas()}if(e.target.id==='reviewRecommendation'){state.recommendation=true;renderCanvas();toast('Proposed diff opened for review')}if(e.target.id==='applyRecommendation'){markChange(`${profiles[state.scope].label} / ${state.provider} · authority-first context closure`);state.inspect='changes';renderCanvas();renderInspector();toast('Recommendation applied to draft')}if(e.target.id==='validate'){state.inspect='validation';renderInspector();$('#inspector').classList.add('open');toast('Draft valid · 5 checks passed')}if(e.target.id==='publish'){state.published='b72fd91';state.changes=[];$('#statusPill').textContent='Published · b72fd91';renderScope();renderInspector();toast('Fake draft published as b72fd91')}if(e.target.id==='undo')toast('Last local change reverted');if(e.target.id==='redo')toast('Local change restored');if(e.target.id==='scopeToggle')$('#scopeRail').classList.toggle('open');if(e.target.id==='inspectToggle')$('#inspector').classList.toggle('open')});
document.addEventListener('input',e=>{if(e.target.dataset.change)markChange(e.target.dataset.change);if(e.target.id==='systemInstruction'){const preview=$('#inputPreview');if(preview)preview.innerHTML=`<span class="dim">provider candidate</span> ${state.provider}\n<span class="dim">profile</span> ${state.scope}\n\n<b>Instruction</b>\n${e.target.value}\n\n<b>Assignment</b>\nproposal/guide-coherence-24 @ immutable v4`}});
$('#overlayClose').onclick=closeOverlay;$('#overlay').addEventListener('change',e=>{if(e.target.id==='testScenario'){state.testScenario=e.target.value;state.testStep='input';$('#overlayBody').innerHTML=testOverlay()}});$('#overlay').addEventListener('click',e=>{if(e.target.id==='runScenario'){state.testStep='output';$('#overlayBody').innerHTML=testOverlay();toast(state.testScenario==='deadline'?'Continuation proposed; lease unchanged':'Fake scenario completed')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#overlay').classList.contains('open'))closeOverlay();else{$('#scopeRail').classList.remove('open');$('#inspector').classList.remove('open')}}});
renderAll();
</script>
</body>
