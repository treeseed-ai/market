function projectionView(p){return `<div class="authority"><strong>§</strong><div><b>The agent estimates work. The control plane owns assignment scope and limits.</b><p>This profile cannot allocate capacity or extend its lease.</p></div></div><div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Tools and plan</h3></div><div class="card-tools"><span class="source">Required policy</span>${helpButton('projection')}</div></div><label class="field">${fieldLabel('Plan structure','projection')}<select data-change="${p.label} / ${state.provider} · plan"><option>Decision-ready editorial plan v3</option><option>Bounded estimate v2</option></select>${fieldFeedback(false)}</label>${['Describe and query content','Read exact TreeDX context','Create linked proposal or note','Validate scoped content'].map((x,i)=>`<label class="check-row"><input type="checkbox" ${i<3?'checked':''} data-change="${p.label} / ${state.provider} · tool ${i}">${x}</label>`).join('')}</div><div class="card continuation" style="margin-top:14px"><div class="card-head"><div><h3>Continuation</h3></div><div class="card-tools"><span class="source override">${state.provider}</span>${helpButton('projection')}</div></div>${['Stop new work when safe completion is unlikely','Preserve completed work and exact references','Propose remaining scope with a revised estimate','Never extend or reinterpret the lease'].map((x,i)=>`<label class="check-row"><input type="checkbox" checked data-change="${p.label} / ${state.provider} · continuation ${i}">${x}</label>`).join('')}${fieldFeedback(false)}</div></section><aside><div class="card soft"><div class="card-head"><div><h3>Plan preview</h3></div><span class="source">Preview</span></div><div class="preview">objective: Improve Guide governance path\nscope: bounded reader journey\nnon_goals: approve or publish\nverification: exact refs retained</div></div><div class="card soft" style="margin-top:14px"><div class="card-head"><div><h3>Continuation preview</h3></div><span class="source">Preview</span></div><div class="preview">status: continuation_required\ncompleted: 3 / 5 deliverables\nremaining_estimate: 420 / 720 / 1080 sec\nauthority_requested: new assignment\nlease_mutation: none</div></div></aside></div>`}
function publicationCard(contract,index,p){const signal=registrySignal(contract);return `<details class="signal-card" style="--signal-color:${p.color}" ${index===0?'open':''}><summary class="signal-summary"><i></i><span><b>${escapeHtml(signal.label)}</b><small>${originBadges(signal)}<code>${signal.id}</code> · ${signal.subjects.join(', ')}</small></span></summary><div class="signal-body"><div class="signal-config"><label class="field">${fieldLabel('Subject identity','output')}<select data-change="${p.label} · ${signal.id} subject">${signal.subjects.map(subject=>`<option>${subject}</option>`).join('')}</select></label><label class="field">${fieldLabel('Evidence','output')}<select data-change="${p.label} · ${signal.id} evidence"><option>Immutable commit or control-plane reference</option><option>Immutable commit required</option></select></label></div><p class="plain-rule">This profile must register <b>${signal.id}</b> through an allowed ${signal.origins.includes('agent')?'agent tool or deterministic producer':'deterministic producer'} before the assignment can complete.</p><div class="signal-actions"><span class="source">signals.publishes[]</span><button class="danger-link" data-remove-publication="${index}">Remove publication</button></div></div></details>`}
function registrationForm(){return `<div class="registry-form"><div class="card-head"><div><h4>Register signal contract</h4><p>Create one reusable handoff, then attach it to this profile.</p></div><button class="danger-link" id="cancelSignalRegistration">Cancel</button></div><div class="signal-config"><label class="field">${fieldLabel('Signal ID','output')}<input id="newSignalId" placeholder="documentation-proposal-ready" data-required></label><label class="field">${fieldLabel('Label','output')}<input id="newSignalLabel" placeholder="Documentation proposal ready" data-required></label><label class="field">${fieldLabel('Subject kinds','output')}<input id="newSignalSubjects" value="proposal" placeholder="proposal, decision"></label><label class="field">${fieldLabel('Commit evidence','output')}<select id="newSignalEvidence"><option>required</option><option>optional</option><option>forbidden</option></select></label><div class="field wide"><span class="field-label">Allowed origins</span><div class="origin-options"><label><input type="checkbox" name="signalOrigin" value="treedx"> TreeDX change</label><label><input type="checkbox" name="signalOrigin" value="process" checked> Deterministic process</label><label><input type="checkbox" name="signalOrigin" value="agent" checked> Agent tool</label></div></div><label class="field">${fieldLabel('Required payload fields','output')}<input id="newSignalRequired" placeholder="proposalId, version, proposalTypes"></label><label class="field">${fieldLabel('Filterable fields','output')}<input id="newSignalFilters" placeholder="proposalTypes, objective"></label></div><div class="signal-actions"><span class="field-hint">Registration is project-wide; publication authority remains profile-specific.</span><button class="action primary" id="registerSignal">Register &amp; publish</button></div></div>`}
function outputView(p){const previews={completed:'message: Plan v4 is ready for estimation.\nsummary: 5 deliverables · 7 evidence refs\nartifact: proposal/guide-coherence-24@v4',blocked:'message: Work stopped; claim 14 lacks authority.\nartifact: question/source-claim-14',none:'message: No Guide strategy work applies.\nartifact: estimate/guide-steward-na-02',continuation:'message: Current lease cannot safely complete the scope.\nartifact: proposal/continuation-guide-24\nlease_mutation: none'},available=signalRegistry.filter(signal=>!p.publications.includes(signal.id));return `<div class="panel-grid wide-left"><section><div class="card"><div class="card-head"><div><h3>Signal publications</h3><p>Registered handoffs this profile is responsible for producing.</p></div><div class="card-tools"><span class="source">signals.publishes[]</span>${helpButton('output')}</div></div>${state.registeringSignal?registrationForm():''}<div class="signal-picker"><label class="field"><span class="field-label">Registered signal</span><select id="outputSignalPicker">${available.map(signal=>`<option value="${signal.id}">${signal.label} · ${signal.origins.join(' / ')}</option>`).join('')||'<option value="">All registered signals selected</option>'}</select></label><div><button class="action" id="addOutputSignal" ${available.length?'':'disabled'}>＋ Add output</button> <button class="action" id="newSignalContract">New signal</button></div></div><div class="signal-stack">${p.publications.map((contract,index)=>publicationCard(contract,index,p)).join('')||'<div class="empty-state">No published signal. This profile does not open another signal-graph node.</div>'}</div></div><div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Result structures</h3></div><div class="card-tools"><span class="source">Profile</span>${helpButton('output')}</div></div><div class="field-grid"><label class="field">${fieldLabel('Summary template','output')}<select data-change="${p.label} / ${state.provider} · summary"><option>Evidence-backed summary v2</option></select></label><label class="field">${fieldLabel('Message template','output')}<select data-change="${p.label} / ${state.provider} · message"><option>Governed handoff v3</option></select></label></div></div></section><aside class="card soft"><div class="card-head"><div><h3>Result preview</h3></div><span class="source">Preview</span></div><div class="scenario-tabs">${Object.keys(previews).map(x=>`<button class="scenario-tab" data-output="${x}" aria-pressed="${state.outputScenario===x}">${x==='none'?'Not applicable':x}</button>`).join('')}</div><div class="preview" id="outputPreview">${previews[state.outputScenario]}\n\nsignals: ${p.publications.join(', ')||'none'}</div></aside></div>`}
function performanceView(p){const metrics=[['Estimate calibration','92%'],['Completion rate','87%'],['Continuation rate','18%'],['Human correction','9%'],['Plan acceptance','81%'],['Tool success','98%'],['Artifact acceptance','94%'],['First useful action','1m 42s']];return `<div class="card soft"><div class="card-head"><div><h3>Observed performance</h3><p>${p.label} · ${state.provider} · ${state.published} · 30 days</p></div><div class="card-tools"><span class="source">Read only</span>${helpButton('performance')}</div></div><div class="metric-grid">${metrics.map((m,i)=>`<div class="metric"><small>${m[0]}</small><b>${m[1]}</b><div class="bar" style="--value:${55+i*5}%;--row-color:${p.color}"><i></i></div></div>`).join('')}</div></div><section class="recommendation"><span class="eyebrow">Recommendation</span><h3>Close required context before tool use</h3><p>Late optional retrieval correlates with continuation.</p><button class="action" id="reviewRecommendation">Review at affected field</button>${state.recommendation?'<button class="action primary" id="applyRecommendation">Apply draft change</button>':''}</section>`}
function renderCanvas(){if(state.scope==='identity'||state.scope==='principles')$('#canvas').innerHTML=identityView(state.scope==='principles');else{const p=profiles[state.scope],body=state.tab==='input'?inputView(p):state.tab==='relation'?relationView(p):state.tab==='projection'?projectionView(p):state.tab==='output'?outputView(p):performanceView(p);$('#canvas').innerHTML=`<div class="canvas-inner">${profileHeader(p)}${body}</div>`}$('#canvas').scrollTop=0}
function renderStatus(){const p=profiles[state.scope];$('#statusColumn').innerHTML=`<section class="status-card"><h3>${state.changes.length?'Unpublished draft':'Published definition'}</h3><div class="status-fact"><span>Published revision</span><b>${state.published}</b></div><div class="status-fact"><span>Draft changes</span><b>${state.changes.length}</b></div><div class="status-fact"><span>Active assignments</span><b>Keep prior revision</b></div>${state.publishedNow?'<p class="valid">Published successfully. Further edits will begin a new draft.</p>':'<p>Publishing creates an immutable definition version. The editor remains open.</p>'}</section><section class="status-card"><h3>Current section</h3><div class="status-fact"><span>Scope</span><b>${p?p.label:'Agent'}</b></div><div class="status-fact"><span>Configuration</span><b class="valid">Valid</b></div><div class="status-fact"><span>Source</span><b>${p?state.provider:'MDX'}</b></div></section><section class="simulator-card"><div class="card-head"><div><h3>Agent Simulator</h3><p>Use the existing seed-backed simulator.</p></div>${helpButton('simulator')}</div><label>Seed<select id="simulatorSeed"><option>treeseed</option><option>engineering</option><option>research</option></select></label><label>Definition<select id="simulatorRevision"><option>${state.changes.length?'Current draft':'Published '+state.published}</option><option>Published ${state.published}</option></select></label><button class="action" id="openSimulator">Open simulator</button></section>`}
function renderAll(){renderHeader();renderScope();renderCanvas();renderStatus()}
function openHelp(id){const item=help[id]||help.identity;state.lastFocus=document.activeElement;$('#helpTitle').textContent=item[0];$('#helpContext').textContent=item[1];$('#helpBody').innerHTML=`<p>${item[2]}</p><h3>Related documentation</h3><div class="help-links">${item[3].map(x=>`<button>${x} →</button>`).join('')}</div>`;$('#helpDialog').classList.add('open');$('#helpClose').focus()}
function closeHelp(){$('#helpDialog').classList.remove('open');state.lastFocus?.focus()}
function toast(message){const node=$('#toast');node.textContent=message;node.classList.add('show');clearTimeout(node.timer);node.timer=setTimeout(()=>node.classList.remove('show'),2200)}
document.addEventListener('click',e=>{const p=profiles[state.scope];if(!p)return;if(e.target.id==='addInputSignal'){const id=$('#inputSignalPicker')?.value;if(id){p.subscriptions.push({contract:id,policy:'any',cardinality:'each',scope:'member-groups',filters:[]});markChange(`${p.label} · signal subscription`);renderCanvas();toast(`Subscribed to ${id}`)}}const removeSubscription=e.target.closest('[data-remove-subscription]');if(removeSubscription){p.subscriptions.splice(Number(removeSubscription.dataset.removeSubscription),1);markChange(`${p.label} · signal subscription`);renderCanvas();toast('Input signal removed')}const addFilter=e.target.closest('[data-add-filter]');if(addFilter){const subscription=p.subscriptions[Number(addFilter.dataset.addFilter)],signal=registrySignal(subscription.contract);subscription.filters.push([signal.fields[0]||'subjectKind','']);markChange(`${p.label} · signal filter`);renderCanvas()}const removeFilter=e.target.closest('[data-remove-filter]');if(removeFilter){const [subscriptionIndex,filterIndex]=removeFilter.dataset.removeFilter.split(':').map(Number);p.subscriptions[subscriptionIndex].filters.splice(filterIndex,1);markChange(`${p.label} · signal filter`);renderCanvas()}if(e.target.id==='addOutputSignal'){const id=$('#outputSignalPicker')?.value;if(id){p.publications.push(id);markChange(`${p.label} · signal publication`);renderCanvas();toast(`Added ${id} publication`)}}const removePublication=e.target.closest('[data-remove-publication]');if(removePublication){p.publications.splice(Number(removePublication.dataset.removePublication),1);markChange(`${p.label} · signal publication`);renderCanvas();toast('Output signal removed')}if(e.target.id==='newSignalContract'){state.registeringSignal=true;renderCanvas();$('#newSignalId')?.focus()}if(e.target.id==='cancelSignalRegistration'){state.registeringSignal=false;renderCanvas()}if(e.target.id==='registerSignal'){const id=$('#newSignalId').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,''),label=$('#newSignalLabel').value.trim(),origins=$$('input[name=signalOrigin]:checked').map(input=>input.value);if(!id||!label||!origins.length){validateControl($('#newSignalId'));validateControl($('#newSignalLabel'));toast('Signal ID, label, and an origin are required');return}if(signalRegistry.some(signal=>signal.id===id)){toast('That signal ID is already registered');return}const subjects=$('#newSignalSubjects').value.split(',').map(x=>x.trim()).filter(Boolean),fields=$('#newSignalFilters').value.split(',').map(x=>x.trim()).filter(Boolean);signalRegistry.push({id,label,origins,subjects:subjects.length?subjects:['content'],fields});p.publications.push(id);state.registeringSignal=false;markChange(`${p.label} · registered ${id}`);renderCanvas();toast(`Registered and added ${id}`)}})
document.addEventListener('input',e=>{const p=profiles[state.scope];if(!p)return;const subscriptionIndex=Number(e.target.dataset.subscriptionIndex);if(Number.isInteger(subscriptionIndex)&&p.subscriptions[subscriptionIndex]){const subscription=p.subscriptions[subscriptionIndex];if(e.target.dataset.subscriptionField)subscription[e.target.dataset.subscriptionField]=e.target.value;if(e.target.dataset.signalFilterKey!==undefined)subscription.filters[Number(e.target.dataset.signalFilterKey)][0]=e.target.value;if(e.target.dataset.signalFilterValue!==undefined)subscription.filters[Number(e.target.dataset.signalFilterValue)][1]=e.target.value;const sentence=$(`[data-subscription-sentence="${subscriptionIndex}"]`);if(sentence)sentence.textContent=subscriptionSentence(subscription);const preview=$('#inputPreview');if(preview)preview.textContent=p.subscriptions.map((item,index)=>`${index+1}. ${subscriptionSentence(item)}`).join('\n\n');markChange(`${p.label} · signal subscription`)}})
document.addEventListener('click',e=>{const scope=e.target.closest('[data-scope]');if(scope){state.scope=scope.dataset.scope;renderAll();$('#scopeRail').classList.remove('open')}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;renderCanvas();renderStatus()}const provider=e.target.closest('[data-provider]');if(provider){state.provider=provider.dataset.provider;renderCanvas();renderStatus()}const output=e.target.closest('[data-output]');if(output){state.outputScenario=output.dataset.output;renderCanvas()}const mode=e.target.closest('[data-markdown-mode]');if(mode){state.markdownMode=mode.dataset.markdownMode;renderCanvas()}const helpTarget=e.target.closest('[data-help]');if(helpTarget)openHelp(helpTarget.dataset.help);const remove=e.target.closest('[data-remove-token]');if(remove){const key=remove.dataset.removeToken.split(':')[0];remove.closest('.token').remove();markChange(`Identity · ${key}`)}const add=e.target.closest('[data-add-token]');if(add){const value=add.dataset.addToken==='groups'?'planning':'book-architecture',span=document.createElement('span');span.className='token';span.textContent=value;add.parentElement.insertBefore(span,add);markChange(`Identity · ${add.dataset.addToken}`)}const restore=e.target.closest('[data-restore]');if(restore){markChange(`${profiles[state.scope].label} / ${state.provider} · inherited instructions`);toast('Inherited value restored')}if(e.target.id==='reviewRecommendation'){state.recommendation=true;state.tab='relation';renderCanvas();toast('Recommendation opened at Context knowledge')}if(e.target.id==='applyRecommendation'){markChange(`${profiles[state.scope].label} / ${state.provider} · required context closure`);renderCanvas();toast('Draft change applied')}if(e.target.id==='undo'){const item=state.changes.shift();if(item)state.redo.unshift(item);renderAll();toast(item?'Change undone':'Nothing to undo')}if(e.target.id==='redo'){const item=state.redo.shift();if(item)state.changes.unshift(item);renderAll();toast(item?'Change restored':'Nothing to redo')}if(e.target.id==='publish'){state.published='b72fd91';state.changes=[];state.redo=[];state.publishedNow=true;renderAll();toast('Published b72fd91 · next edit starts a new draft')}if(e.target.id==='openSimulator')toast(`Opening Agent Simulator · ${$('#simulatorSeed').value} seed · ${profiles[state.scope]?.label||'agent'} context`);if(e.target.id==='closeDesigner')location.href='agent-lab.html';if(e.target.id==='scopeToggle')$('#scopeRail').classList.toggle('open');if(e.target.id==='statusToggle')$('#statusColumn').classList.toggle('open')});
document.addEventListener('input',e=>{if(e.target.dataset.change){markChange(e.target.dataset.change);const field=e.target.closest('.field');if(field){let feedback=field.querySelector('.field-feedback');if(feedback){feedback.className='field-feedback changed';feedback.textContent='● Changed from published';if(!field.querySelector('.field-diff'))feedback.insertAdjacentHTML('afterend','<span class="field-diff">Published value remains active until this draft is published.</span>')}}}if(e.target.id==='purposeEditor')identity.purpose=e.target.value;if(e.target.id==='markdownEditor')identity.body=e.target.value;if(e.target.id==='systemInstruction'){const preview=$('#inputPreview');if(preview)preview.textContent=`provider candidate: ${state.provider}\nprofile: ${state.scope}\n\n${e.target.value}`}});
document.addEventListener('change',e=>{if(e.target.id==='identityTemplate'){state.template=e.target.value;markChange('Identity · content template');toast(`${state.template} selected`)}});$('#helpClose').onclick=closeHelp;$('#helpDialog').onclick=e=>{if(e.target===$('#helpDialog'))closeHelp()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#helpDialog').classList.contains('open'))closeHelp();else{$('#scopeRail').classList.remove('open');$('#statusColumn').classList.remove('open')}}});renderAll();
</script>
</body>
