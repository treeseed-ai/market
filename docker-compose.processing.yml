services:
  api:
    image: treeseed-processing:local
    build:
      context: .
      dockerfile: Dockerfile.processing
    command: ["api"]
    env_file:
      - path: .env.local.processing.example
        required: false
      - path: .env.local.processing
        required: false
    environment:
      TREESEED_PROCESSING_ROLE: api
      TREESEED_ENVIRONMENT: local
      TREESEED_DEPLOY_ENVIRONMENT: local
      TREESEED_PROCESSING_PARITY: "1"
      TREESEED_DATA_DIR: /data
      TREESEED_RUNNER_VOLUME_ROOT: /data
      PORT: "3100"
    ports:
      - "8788:3100"
    volumes:
      - ./.treeseed/local-processing/data:/data

  manager:
    image: treeseed-processing:local
    command: ["manager"]
    env_file:
      - path: .env.local.processing.example
        required: false
      - path: .env.local.processing
        required: false
    environment:
      TREESEED_PROCESSING_ROLE: manager
      TREESEED_ENVIRONMENT: local
      TREESEED_DEPLOY_ENVIRONMENT: local
      TREESEED_PROCESSING_PARITY: "1"
      TREESEED_MANAGER_MODE: reconcile
      TREESEED_DATA_DIR: /data
      TREESEED_RUNNER_VOLUME_ROOT: /data
    volumes:
      - ./.treeseed/local-processing/data:/data
    depends_on:
      - api

  worker:
    image: treeseed-processing:local
    command: ["worker"]
    env_file:
      - path: .env.local.processing.example
        required: false
      - path: .env.local.processing
        required: false
    environment:
      TREESEED_PROCESSING_ROLE: worker
      TREESEED_ENVIRONMENT: local
      TREESEED_DEPLOY_ENVIRONMENT: local
      TREESEED_PROCESSING_PARITY: "1"
      TREESEED_DATA_DIR: /data
      TREESEED_RUNNER_VOLUME_ROOT: /data
      TREESEED_WORKER_IDLE_EXIT_MS: "60000"
    volumes:
      - ./.treeseed/local-processing/data:/data
    depends_on:
      - api
