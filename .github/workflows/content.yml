name: Content

on:
  push:
    branches: [staging, main]
    paths:
      - 'src/content/**'
  pull_request:
    paths:
      - 'src/content/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout canonical content publisher
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/sdk
          ref: ${{ github.base_ref }}
          path: .treeseed/content-publisher
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .treeseed/content-publisher/package-lock.json

      - name: Build canonical content publisher
        working-directory: .treeseed/content-publisher
        run: npm ci --ignore-scripts && npm run build:dist

      - name: Validate exact content commit
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${SOURCE_COMMIT}" = "${{ github.event.pull_request.head.sha }}"
          node ./.treeseed/content-publisher/dist/scripts/content/publish-content.js \
            --root . \
            --content-path src/content \
            --source-commit "${SOURCE_COMMIT}" \
            --ref "${GITHUB_HEAD_REF}" \
            --channel staging \
            --validate-only > content-publication-receipt.json

      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: content-validation-${{ github.sha }}
          path: content-publication-receipt.json

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical content publisher
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/sdk
          ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
          path: .treeseed/content-publisher
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .treeseed/content-publisher/package-lock.json

      - name: Build canonical content publisher
        working-directory: .treeseed/content-publisher
        run: npm ci --ignore-scripts && npm run build:dist

      - name: Publish exact content commit
        env:
          TREESEED_TEAM_ID: treeseed
          TREESEED_PROJECT_ID: market
          TREESEED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.TREESEED_CLOUDFLARE_ACCOUNT_ID }}
          TREESEED_CONTENT_BUCKET_NAME: ${{ vars.TREESEED_CONTENT_BUCKET_NAME }}
          TREESEED_R2_ACCESS_KEY_ID: ${{ secrets.TREESEED_R2_ACCESS_KEY_ID }}
          TREESEED_R2_SECRET_ACCESS_KEY: ${{ secrets.TREESEED_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          CHANNEL=staging
          if test "${GITHUB_REF_NAME}" = main; then CHANNEL=production; fi
          node ./.treeseed/content-publisher/dist/scripts/content/publish-content.js --acceptance --team-id "${TREESEED_TEAM_ID}" > r2-acceptance-receipt.json
          node ./.treeseed/content-publisher/dist/scripts/content/publish-content.js \
            --root . \
            --content-path src/content \
            --source-commit "${SOURCE_COMMIT}" \
            --ref "${GITHUB_REF_NAME}" \
            --channel "${CHANNEL}" > content-publication-receipt.json

      - name: Upload publication receipts
        uses: actions/upload-artifact@v4
        with:
          name: content-publication-${{ github.sha }}
          path: |
            r2-acceptance-receipt.json
            content-publication-receipt.json
