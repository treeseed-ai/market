name: Verify

on:
  push:
    branches-ignore:
      - staging
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TREESEED_BOOTSTRAP_MODE: auto
      TREESEED_STAGE_WAIT_MODE: skip
      TREESEED_AGENT_DISABLE_GIT: "true"
      TREESEED_FIXTURE_ID: treeseed-working-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          node -e "const fs = require('fs'); for (const file of ['packages/sdk/package.json', 'packages/agent/package.json', 'packages/core/package.json', 'packages/cli/package.json']) { if (!fs.existsSync(file)) continue; const p = JSON.parse(fs.readFileSync(file, 'utf8')); if (p.scripts) delete p.scripts.prepare; fs.writeFileSync(file, JSON.stringify(p, null, '\t') + '\n'); }"
          npm ci
          for dir in packages/sdk packages/agent packages/core packages/cli; do
            if test -d "${dir}/.git" || git -C "${dir}" rev-parse --git-dir >/dev/null 2>&1; then
              git -C "${dir}" checkout -- package.json
            fi
          done

      - name: Verify package
        run: npm run verify:direct

      - name: Verify processing parity and transparent agent ladder
        run: |
          npm run test:agent-contracts
          npm run test:agent-handlers
          npm run test:agent-message-chains
          npm run test:manager-worker
          npm run test:processing-parity-local

      - name: Upload Treeseed test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treeseed-test-reports
          path: .treeseed/test-reports/**
          if-no-files-found: ignore
