name: Treeseed Market Deploy

on:
  push:
    branches:
      - staging
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      action_kind:
        description: Workflow action to perform
        required: true
        default: deploy_web
        type: choice
        options:
          - deploy_web
          - publish_content
          - monitor
      project_id:
        description: Treeseed project id for control-plane reporting
        required: false
        type: string
      preview_id:
        description: Optional preview overlay id for editorial publishes
        required: false
        type: string

concurrency:
  group: treeseed-market-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      web_changed: ${{ steps.classify.outputs.web_changed }}
      content_changed: ${{ steps.classify.outputs.content_changed }}
      release_tag: ${{ steps.classify.outputs.release_tag }}
      workflow_action: ${{ steps.classify.outputs.workflow_action }}
      preview_id: ${{ steps.classify.outputs.preview_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.environment }}"
            workflow_action="${{ inputs.action_kind }}"
            release_tag="false"
            preview_id="${{ inputs.preview_id }}"
            web_changed=$([[ "${workflow_action}" == "deploy_web" || "${workflow_action}" == "publish_content" ]] && echo "true" || echo "false")
            content_changed=$([[ "${workflow_action}" == "publish_content" ]] && echo "true" || echo "false")
          else
            scope=$([[ "${GITHUB_REF_TYPE}" == "tag" ]] && echo "prod" || echo "staging")
            workflow_action="auto"
            release_tag=$([[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo "true" || echo "false")
            preview_id="staging-${GITHUB_SHA}"
            compare_ref="${{ github.event.before }}"
            if [[ -z "${compare_ref}" || "${compare_ref}" == "0000000000000000000000000000000000000000" ]]; then
              compare_ref="$(git rev-list --max-count=1 "${GITHUB_SHA}^" 2>/dev/null || true)"
            fi
            web_changed="false"
            content_changed="false"
            if [[ -z "${compare_ref}" || "${release_tag}" == "true" ]]; then
              web_changed="true"
            else
              while IFS= read -r path; do
                [[ -z "${path}" ]] && continue
                case "${path}" in
                  src/content/*|content/*|books/*|docs/*)
                    content_changed="true"
                    web_changed="true"
                    ;;
                  packages/api/**|treeseed.site.yaml|.railwayignore|.gitignore)
                    web_changed="true"
                    ;;
                  packages/sdk/*|package.json|package-lock.json|.github/workflows/*)
                    web_changed="true"
                    ;;
                  *)
                    web_changed="true"
                    ;;
                esac
              done < <(git diff --name-only "${compare_ref}" "${GITHUB_SHA}")
            fi
          fi

          {
            echo "scope=${scope}"
            echo "web_changed=${web_changed}"
            echo "content_changed=${content_changed}"
            echo "release_tag=${release_tag}"
            echo "workflow_action=${workflow_action}"
            echo "preview_id=${preview_id}"
          } >> "${GITHUB_OUTPUT}"

  deploy-web:
    needs:
      - classify
      - preflight
    if: |
      needs.classify.outputs.workflow_action == 'deploy_web' ||
      needs.classify.outputs.workflow_action == 'publish_content' ||
      needs.classify.outputs.workflow_action == 'monitor' ||
      needs.classify.outputs.web_changed == 'true' ||
      needs.classify.outputs.content_changed == 'true' ||
      needs.classify.outputs.release_tag == 'true'
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: ${{ needs.classify.outputs.scope }}
      action_kind: ${{ needs.classify.outputs.workflow_action == 'publish_content' && 'publish_content' || (needs.classify.outputs.workflow_action == 'monitor' && 'monitor' || 'deploy_web') }}
      project_id: ${{ inputs.project_id || vars.TREESEED_PROJECT_ID }}
      preview_id: ${{ inputs.preview_id || needs.classify.outputs.preview_id }}
    secrets: inherit

  preflight:
    needs: classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build SDK for readiness checks
        run: npm -w packages/sdk run build:dist
      - name: Validate deployment readiness
        run: |
          node ./packages/sdk/scripts/run-ts.mjs ./packages/sdk/scripts/deployment-readiness.ts \
            --environment "${{ needs.classify.outputs.scope }}" \
            --strict

  acceptance-prepare:
    needs:
      - classify
      - preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build SDK client for acceptance
        run: npm -w packages/sdk run build:dist
      - uses: actions/upload-artifact@v4
        with:
          name: api-acceptance-sdk-${{ github.sha }}
          path: packages/sdk/dist/
          if-no-files-found: error

  runner-smoke:
    needs:
      - classify
      - deploy-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ needs.classify.outputs.scope == 'prod' && 'production' || 'staging' }}
    env:
      TREESEED_MARKET_API_BASE_URL: ${{ needs.classify.outputs.scope == 'prod' && (vars.TREESEED_MARKET_API_BASE_URL || vars.TREESEED_CENTRAL_MARKET_API_BASE_URL || 'https://api.treeseed.ai') || (vars.TREESEED_STAGING_MARKET_API_BASE_URL || 'https://api-treeseed-staging.treeseed.ai') }}
      TREESEED_ACCEPTANCE_SERVICE_ID: ${{ secrets.TREESEED_ACCEPTANCE_SERVICE_ID || vars.TREESEED_API_WEB_SERVICE_ID || vars.TREESEED_WEB_SERVICE_ID || 'web' }}
      TREESEED_ACCEPTANCE_SERVICE_SECRET: ${{ secrets.TREESEED_API_WEB_SERVICE_SECRET || secrets.TREESEED_WEB_SERVICE_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Treeseed operations runner smoke
        run: |
          node ./packages/sdk/scripts/run-ts.mjs ./packages/sdk/scripts/operations-runner-smoke.ts \
            --environment "${{ needs.classify.outputs.scope }}"

  bootstrap-public-treedx:
    needs:
      - classify
      - deploy-web
      - runner-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ needs.classify.outputs.scope == 'prod' && 'production' || 'staging' }}
    env:
      TREESEED_WORKFLOW_ENVIRONMENT: ${{ needs.classify.outputs.scope }}
      TREESEED_MARKET_API_BASE_URL: ${{ needs.classify.outputs.scope == 'prod' && (vars.TREESEED_MARKET_API_BASE_URL || vars.TREESEED_CENTRAL_MARKET_API_BASE_URL || 'https://api.treeseed.ai') || (vars.TREESEED_STAGING_MARKET_API_BASE_URL || 'https://api-treeseed-staging.treeseed.ai') }}
      TREESEED_API_WEB_SERVICE_ID: ${{ vars.TREESEED_API_WEB_SERVICE_ID || vars.TREESEED_WEB_SERVICE_ID || 'web' }}
      TREESEED_API_WEB_SERVICE_SECRET: ${{ secrets.TREESEED_API_WEB_SERVICE_SECRET || secrets.TREESEED_WEB_SERVICE_SECRET }}
      TREESEED_PUBLIC_TREEDX_TEAM_ID: ${{ vars.TREESEED_PUBLIC_TREEDX_TEAM_ID || vars.TREESEED_HOSTING_TEAM_ID }}
      TREESEED_PUBLIC_TREEDX_TEAM_SLUG: ${{ vars.TREESEED_PUBLIC_TREEDX_TEAM_SLUG || 'treeseed-public' }}
      TREESEED_PUBLIC_TREEDX_IMAGE_REF: ${{ vars.TREESEED_PUBLIC_TREEDX_IMAGE_REF || 'treeseed/treedx:latest' }}
      TREESEED_PUBLIC_TREEDX_WAIT_MS: ${{ vars.TREESEED_PUBLIC_TREEDX_WAIT_MS || '900000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure public TreeDX federation
        run: node ./scripts/bootstrap-public-treedx.mjs

  acceptance:
    needs:
      - classify
      - deploy-web
      - bootstrap-public-treedx
      - acceptance-prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ needs.classify.outputs.scope == 'prod' && 'production' || 'staging' }}
    env:
      TREESEED_ACCEPTANCE_SITE_ADMIN_TOKEN: ${{ secrets.TREESEED_ACCEPTANCE_SITE_ADMIN_TOKEN }}
      TREESEED_ACCEPTANCE_TEAM_OWNER_TOKEN: ${{ secrets.TREESEED_ACCEPTANCE_TEAM_OWNER_TOKEN }}
      TREESEED_ACCEPTANCE_TEAM_VIEWER_TOKEN: ${{ secrets.TREESEED_ACCEPTANCE_TEAM_VIEWER_TOKEN }}
      TREESEED_ACCEPTANCE_PROVIDER_TOKEN: ${{ secrets.TREESEED_ACCEPTANCE_PROVIDER_TOKEN }}
      TREESEED_ACCEPTANCE_SERVICE_ID: ${{ secrets.TREESEED_ACCEPTANCE_SERVICE_ID || vars.TREESEED_API_WEB_SERVICE_ID || vars.TREESEED_WEB_SERVICE_ID || 'web' }}
      TREESEED_ACCEPTANCE_SERVICE_SECRET: ${{ secrets.TREESEED_API_WEB_SERVICE_SECRET || secrets.TREESEED_WEB_SERVICE_SECRET }}
      TREESEED_MARKET_API_BASE_URL: ${{ needs.classify.outputs.scope == 'prod' && (vars.TREESEED_MARKET_API_BASE_URL || vars.TREESEED_CENTRAL_MARKET_API_BASE_URL || 'https://api.treeseed.ai') || (vars.TREESEED_STAGING_MARKET_API_BASE_URL || 'https://api-treeseed-staging.treeseed.ai') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: api-acceptance-sdk-${{ github.sha }}
          path: packages/sdk/dist/
      - name: Run live API acceptance
        run: |
          npm run test:acceptance -- \
            --environment "${{ needs.classify.outputs.scope }}" \
            --base-url "${TREESEED_MARKET_API_BASE_URL}" \
            --report-json reports/api-acceptance.json \
            --report-junit reports/api-acceptance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-acceptance-${{ needs.classify.outputs.scope }}
          path: reports/
