name: Treeseed Production Release

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact successful staging candidate identifier
        required: true
        type: string
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: treeseed-production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      TREESEED_RELEASE_EXECUTION: hosted
      TREESEED_WORKFLOW_ENVIRONMENT: prod
      TREESEED_GITHUB_TOKEN: ${{ secrets.TREESEED_GITHUB_TOKEN }}
      TREESEED_RAILWAY_API_TOKEN: ${{ secrets.TREESEED_RAILWAY_API_TOKEN }}
      TREESEED_CLOUDFLARE_API_TOKEN: ${{ secrets.TREESEED_CLOUDFLARE_API_TOKEN }}
      TREESEED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.TREESEED_CLOUDFLARE_ACCOUNT_ID }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Hydrate staging attestation
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow staging-candidate.yml --commit "${GITHUB_SHA}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "${run_id}"
          gh run download "${run_id}" --name "treeseed-staging-candidate-${GITHUB_SHA}" --dir .
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const path = '.treeseed/workflow/stage-candidates/latest.attestation.json';
          const attestation = JSON.parse(readFileSync(path, 'utf8'));
          if (attestation.candidateId !== process.env.CANDIDATE_ID || attestation.status !== 'passed') process.exit(1);
          if (attestation.counts.passed !== 208 || attestation.counts.failed || attestation.counts.blocked || attestation.counts.skipped || attestation.counts.releaseBlockingFailures) process.exit(1);
          NODE
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
      - name: Prepare release operator
        run: |
          npx --yes tsx ./.github/scripts/prepare-workspace-install.ts
          npm ci --ignore-scripts --no-audit --no-fund
          npm -w packages/sdk run build:dist
          npm -w packages/cli run build:dist
      - name: Promote attested candidate
        run: node packages/cli/dist/cli/main.js release --${{ inputs.bump }} --fresh --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treeseed-production-release-${{ github.run_id }}
          path: |
            .treeseed/workflow/runs/**
            .treeseed/workflow/stage-candidates/**
          if-no-files-found: warn
          retention-days: 90
