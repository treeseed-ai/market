schemaVersion: treeseed.scene/v1
id: user-team-management-demo
title: User And Team Management Demo
description: >-
  Register a small business owner, review account settings, create the TreeSeed team,
  invite project leads and contributors, accept each invitation through Mailpit, and
  verify the full team roster. This is a polished QA/demo scene for the central
  TreeSeed acceptance test harness and demo / educational video generator.
audience:
  - evaluator
  - operator
  - trainee

mode:
  test: true
  demo: true
  training: true

runtime:
  mode: training
  timeouts:
    sceneSeconds: 2400
    chapterSeconds: 900
    stepSeconds: 120
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false

target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900

devices:
  defaultProfile: desktop
  profiles:
    - id: desktop
      title: Desktop
      orientation: landscape
      viewport: { width: 1600, height: 900 }
      video: { width: 1600, height: 900 }
      output: { width: 1920, height: 1080 }
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
      browserFrame:
        enabled: true
        title: TreeSeed Team Management
        chrome: desktop
    - id: tablet
      title: Tablet
      orientation: landscape
      viewport: { width: 1024, height: 768 }
      video: { width: 1024, height: 768 }
      output: { width: 1440, height: 1080 }
      deviceScaleFactor: 1
      isMobile: true
      hasTouch: true
      browserFrame:
        enabled: true
        title: TreeSeed Team Management
        chrome: tablet
    - id: mobile
      title: Mobile
      orientation: portrait
      viewport: { width: 390, height: 844 }
      video: { width: 390, height: 844 }
      output: { width: 1080, height: 1920 }
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
      browserFrame:
        enabled: true
        title: TreeSeed Team Management
        chrome: mobile

setup:
  dev:
    required: true
    command: trsd dev start --web-runtime local --json
    reuseExisting: true

artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true

render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution: { width: 1920, height: 1080 }
    capture:
      viewport: { width: 1600, height: 900 }
      video: { width: 1600, height: 900 }
      evidenceFit: fixed-browser
    browserFrame:
      enabled: true
      title: TreeSeed Team Management

chapters:
  - id: owner-registration
    title: Register and verify the owner
    startsAt: owner-open-register
  - id: account-settings
    title: Review account settings
    startsAt: owner-open-account
  - id: team-setup
    title: Create the TreeSeed team
    startsAt: owner-open-new-team
  - id: invitations
    title: Invite team members
    startsAt: owner-open-team-members
  - id: invite-acceptance
    title: Accept invitations
    startsAt: avery-open-invite
  - id: final-roster
    title: Verify the full team
    startsAt: owner-final-sign-in

overlays:
  - id: intro-context
    at: owner-open-register
    renderer: remotion
    type: callout
    variant: panel
    region: top-right
    durationSeconds: 10
    style:
      tone: brand
      shadow: medium
      radius: 8
      background: rgba(15, 23, 42, 0.9)
      color: "#f8fafc"
    motion:
      keyframes:
        - at: 0
          unit: progress
          opacity: 0
          position: { x: 92, y: 10, unit: percent }
        - at: 0.2
          unit: progress
          opacity: 1
          position: { x: 72, y: 10, unit: percent }
        - at: 1
          unit: progress
          opacity: 1
          position: { x: 72, y: 10, unit: percent }
    text: A small business owner creates a team, invites collaborators, and verifies role-based access.
  - id: account-tabs-context
    at: owner-open-account
    renderer: remotion
    type: callout
    variant: badge
    region: top-right
    durationSeconds: 8
    style:
      tone: info
      shadow: soft
    text: Account QA covers profile, security, and sessions while intentionally skipping account deletion.
  - id: invite-flow-context
    at: owner-invite-avery
    renderer: remotion
    type: callout
    variant: panel
    region: top-right
    durationSeconds: 12
    style:
      tone: info
      shadow: medium
      radius: 8
    text: Each invite goes through Mailpit so the test proves local email delivery and invite registration.
  - id: final-team-management-summary
    at: owner-final-roster
    renderer: remotion
    type: callout
    variant: panel
    region: right
    durationSeconds: 16
    style:
      tone: brand
      background: rgba(15, 23, 42, 0.86)
      color: "#f8fafc"
      shadow: strong
      radius: 8
    motion:
      keyframes:
        - at: 0
          unit: progress
          opacity: 0
          position: { x: 98, y: 16, unit: percent }
        - at: 0.22
          unit: progress
          opacity: 1
          position: { x: 70, y: 16, unit: percent }
        - at: 1
          unit: progress
          opacity: 1
          position: { x: 70, y: 16, unit: percent }
    objects:
      - id: roster-check
        type: badge
        text: Verified roster
        region: top
        style:
          tone: success
          shadow: soft
        motion:
          keyframes:
            - at: 0
              unit: progress
              scale: 0.96
              opacity: 0
            - at: 0.35
              unit: progress
              scale: 1
              opacity: 1
            - at: 1
              unit: progress
              scale: 1
              opacity: 1
    text: TreeSeed teams give small businesses one place to manage ownership, roles, invitations, and project access before the work starts.

training:
  enabled: true
  captions:
    enabled: true
    formats: [vtt, srt]
    maxCueSeconds: 6
    renderInTrainingVideo: true
  transcript:
    enabled: true
    formats: [json, markdown]
  narration:
    enabled: true
    style: instructional
    includeDiagnostics: true
  glossary:
    enabled: true
    terms:
      - term: team
        definition: A shared workspace that owns members, roles, and project access.
      - term: project lead
        definition: A team role used as the admin-equivalent collaborator in this demo.
      - term: contributor
        definition: A standard team member role for participating in project work.
      - term: invite
        definition: A Mailpit-delivered link that lets a new user register and join the team.
      - term: Mailpit
        definition: The local email inbox used by TreeSeed dev scenes.
      - term: checkpoint
        definition: A resumable point in a scene run for debugging failures.
  chapterClips:
    enabled: true
    format: manifest

xScenario:
  owner:
    name: TreeSeed Admin
    email: demo.admin@treeseed.io
    username: demo-admin
  team:
    displayName: TreeSeed
    slug: treeseed
  invitedUsers:
    - name: Avery Project Lead
      email: avery.admin@treeseed.io
      username: avery-admin
      role: project_lead
    - name: Casey Member
      email: casey.member@treeseed.io
      username: casey-member
      role: contributor
    - name: Jordan Member
      email: jordan.member@treeseed.io
      username: jordan-member
      role: contributor
    - name: Riley Member
      email: riley.member@treeseed.io
      username: riley-member
      role: contributor
  knownGaps:
    - The local app database must be fresh or cleaned because this strict QA scene uses stable emails and a stable team slug.
    - The invite flow depends on team invite email delivery and invite-bound registration being available.

workflow:
  - id: owner-open-register
    title: Open owner registration
    action:
      goto: /auth/register?returnTo=/app
    expect:
      urlIncludes: /auth/register
  - id: owner-review-register-form
    title: Review owner registration form
    action:
      pause: { mode: timed, durationSeconds: 3, prompt: Review the owner registration form }
    expect:
      visible:
        - css: body
          internal: true
  - id: owner-fill-first-name
    title: Enter owner first name
    action:
      fill: { css: 'input[name="firstName"]', internal: true, value: TreeSeed }
  - id: owner-fill-last-name
    title: Enter owner last name
    action:
      fill: { css: 'input[name="lastName"]', internal: true, value: Admin }
  - id: owner-fill-username
    title: Enter owner username
    action:
      fill: { css: 'input[name="username"]', internal: true, value: demo-admin }
  - id: owner-fill-email
    title: Enter owner email
    action:
      fill: { css: 'input[name="email"]', internal: true, value: demo.admin@treeseed.io }
  - id: owner-fill-password
    title: Enter owner password
    action:
      fill: { css: 'input[name="password"]', internal: true, value: TreeSeedDemo!Owner2026 }
  - id: owner-fill-confirm-password
    title: Confirm owner password
    action:
      fill: { css: 'input[name="confirmPassword"]', internal: true, value: TreeSeedDemo!Owner2026 }
  - id: owner-review-registration-details
    title: Review owner registration details
    action:
      pause: { mode: timed, durationSeconds: 2, prompt: Review owner registration details }
    expect:
      visible:
        - css: body
          internal: true
  - id: owner-submit-registration
    title: Submit owner registration
    action:
      click: { role: button, name: Create account }
    expect:
      text: Check your email
  - id: owner-review-check-email
    title: Review owner email confirmation prompt
    action:
      pause: { mode: timed, durationSeconds: 3, prompt: Review the check email prompt }
    expect:
      visible:
        - css: body
          internal: true
  - id: owner-confirm-email
    title: Confirm owner email through Mailpit
    action:
      mailpitConfirmLatest:
        mailpitUrl: __USER_TEAM_MAILPIT_URL__
        email: demo.admin@treeseed.io
        subjectIncludes: Confirm
        displayInboxSeconds: 3
        displayMessageSeconds: 4
    expect:
      urlIncludes: /app
  - id: owner-review-confirmed-app
    title: Review confirmed owner app access
    action:
      pause: { mode: timed, durationSeconds: 3, prompt: Owner confirmed and inside the app }
    expect:
      urlIncludes: /app
  - id: owner-verify-app
    title: Verify owner is in the app
    action:
      goto: /app
    expect:
      urlIncludes: /app
  - id: owner-open-account
    title: Open account settings
