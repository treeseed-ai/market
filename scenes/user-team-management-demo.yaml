    action:
      fill: { css: '#invite-form input[name="email"]', internal: true, value: avery.admin@treeseed.io }
  - id: owner-select-avery-role
    title: Select Avery role
    action:
      select: { css: '#invite-form select[name="roleKey"]', internal: true, value: project_lead }
  - id: owner-submit-avery-invite
