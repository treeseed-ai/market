      click: { css: '[data-account-tab="profile"]', internal: true }
    expect:
      text: demo.admin@treeseed.io
  - id: owner-review-profile-tab
    title: Review profile tab
    action:
      pause: { mode: timed, durationSeconds: 2, prompt: Review profile tab }
    expect:
      visible:
        - css: body
          internal: true
  - id: owner-view-security-tab
    title: View security account tab
