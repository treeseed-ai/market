  - id: owner-review-created-team
    title: Review created TreeSeed team
    action:
      pause: { mode: timed, durationSeconds: 3, prompt: TreeSeed team created }
    expect:
      urlIncludes: /app/teams
  - id: owner-open-team-members
    title: Open TreeSeed member management
