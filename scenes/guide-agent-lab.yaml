schemaVersion: treeseed.scene/v1
id: guide-agent-lab
title: TreeSeed Guide Production Agent Lab
description: Run the complete Guide editorial roster through isolated production workdays with a live, self-contained forensic report.
audience: [operator, agent-developer, qa]

journey:
  kind: agent-lab
  proves:
    - agent-testing/production-lab

mode:
  test: true
  demo: false
  training: false

target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport: { width: 1600, height: 1000 }

setup:
  dev:
    required: true
    reuseExisting: true
  seeds:
    - name: treeseed
      environments: [local]
      apply: true

artifacts:
  trace: false
  video: false
  screenshots: false
  console: true
  network: true
  timeline: true
  appLogs: true

workflow: []

agentLab:
  scope:
    kind: team
    team: team:treeseed
    capacityProvider: capacity-provider:treeseed/local
  provider: local
  executionProvider: codex
  presentation: race-control
  timeZone: America/New_York
  repositories: [market]
  agents: []
  agentClasses: []
  workdays:
    - id: guide-editorial-cycle
      title: Guide Editorial Cycle
      agentTests: [guide-editorial-cycle]
      objectiveRefs: [objective:harden-documentation-automation-workday-loop]
      durationSeconds: 5400
      availableCredits: 64
      maxActiveAssignments: 4
      planningOnly: true

training:
  enabled: false
