schemaVersion: treeseed.scene/v1
id: guide-editorial-demo-shakedown
title: Guide Editorial Demo Shakedown
description: Short retained production-path exercise of the complete Guide cooperative-planning signal graph.
audience: [operator, agent-developer]

journey:
  kind: agent-lab
  proves: []

mode: { test: false, demo: true, training: false }
runtime: { mode: demo }
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport: { width: 1440, height: 900 }
setup:
  dev: { required: true, reuseExisting: true }
  seeds:
    - name: treeseed
      environments: [local]
      apply: true
artifacts:
  trace: false
  video: false
  screenshots: false
  console: true
  network: true
  timeline: true
  appLogs: true
workflow: []

agentLab:
  scope:
    kind: team
    team: team:treeseed
    capacityProvider: capacity-provider:treeseed/local
  provider: local
  executionProvider: codex
  presentation: race-control
  timeZone: America/New_York
  repositories: [market]
  agents: [evidence-researcher, guide-steward, guide-writer, knowledge-cartographer, technical-verifier, audience-reviewer, publication-steward, workday-reporter]
  agentClasses: []
  workdays:
    - id: editorial-demo-shakedown
      title: Guide Editorial Demo Shakedown
      agentTests: [guide-editorial-cycle]
      objectiveRefs: [objective:harden-documentation-automation-workday-loop]
      durationSeconds: 1500
      timePolicy: { cooperativePlanningPercent: 90, governedExecutionPercent: 0, reservePercent: 10 }
      planningSession: { rounds: 3, assignmentTimeboxSeconds: 240, tokenWarning: 6000 }
      maxActiveAssignments: 4
      planningOnly: true

training: { enabled: false }
