schemaVersion: treeseed.scene/v1
id: guide-editorial-synthesis-agent-lab
title: Guide Evidence to Proposal Production Agent Lab
description: Verify the production evidence-to-proposal handoff between the Documentation Evidence Analyst and Guide Strategy Editor.
audience: [operator, agent-developer, qa]

journey:
  kind: agent-lab
  proves: [agent-testing/production-lab]

mode: { test: true, demo: false, training: false }
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport: { width: 1600, height: 1000 }
setup:
  dev: { required: true, reuseExisting: true }
  seeds:
    - name: treeseed
      environments: [local]
      apply: true
artifacts:
  trace: false
  video: false
  screenshots: false
  console: true
  network: true
  timeline: true
  appLogs: true
workflow: []

agentLab:
  scope:
    kind: team
    team: team:treeseed
    capacityProvider: capacity-provider:treeseed/local
  provider: local
  executionProvider: codex
  presentation: race-control
  timeZone: America/New_York
  repositories: [market]
  agents: [evidence-researcher, guide-steward]
  agentClasses: []
  workdays:
    - id: editorial-synthesis
      title: Guide Evidence to Proposal Handoff
      agentTests: [guide-editorial-cycle]
      objectiveRefs: [objective:harden-documentation-automation-workday-loop]
      durationSeconds: 1200
      availableCredits: 16
      maxActiveAssignments: 1
      planningOnly: true

training: { enabled: false }
