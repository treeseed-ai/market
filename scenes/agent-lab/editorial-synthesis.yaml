schemaVersion: treeseed.scene/v1
id: guide-editorial-synthesis-agent-lab
title: Guide Cooperative Planning Agent Lab
description: Exercise the complete Guide editorial signal graph through synchronized cooperative-planning waves.
audience: [operator, agent-developer, qa]

journey:
  kind: agent-lab
  proves: [agent-testing/production-lab]

mode: { test: true, demo: false, training: false }
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport: { width: 1600, height: 1000 }
setup:
  dev: { required: true, reuseExisting: true }
  seeds:
    - name: treeseed
      environments: [local]
      apply: true
artifacts:
  trace: false
  video: false
  screenshots: false
  console: true
  network: true
  timeline: true
  appLogs: true
workflow: []

agentLab:
  scope:
    kind: team
    team: team:treeseed
    capacityProvider: capacity-provider:treeseed/local
  provider: local
  executionProvider: codex
  presentation: race-control
  timeZone: America/New_York
  repositories: [market]
  agents: [evidence-researcher, guide-steward, guide-writer, knowledge-cartographer, technical-verifier, audience-reviewer, publication-steward, workday-reporter]
  agentClasses: []
  workdays:
    - id: editorial-synthesis
      title: Guide Cooperative Planning Session
      agentTests: [guide-editorial-cycle]
      objectiveRefs: [objective:harden-documentation-automation-workday-loop]
      durationSeconds: 3600
      timePolicy: { cooperativePlanningPercent: 90, governedExecutionPercent: 0, reservePercent: 10 }
      planningSession: { rounds: 3, assignmentTimeboxSeconds: 540, tokenWarning: 24000 }
      maxActiveAssignments: 4
      planningOnly: true

training: { enabled: false }
