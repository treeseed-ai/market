schemaVersion: treeseed.scene/v1
id: guide-evidence-researcher-agent-lab
title: Documentation Evidence Analyst Production Agent Lab
description: Verify the Documentation Evidence Analyst through a short production-path discovery workday before integrated Guide execution.
audience: [operator, agent-developer, qa]

journey:
  kind: agent-lab
  proves: [agent-testing/production-lab]

mode: { test: true, demo: false, training: false }
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport: { width: 1600, height: 1000 }
setup:
  dev: { required: true, reuseExisting: true }
  seeds:
    - name: treeseed
      environments: [local]
      apply: true
artifacts:
  trace: false
  video: false
  screenshots: false
  console: true
  network: true
  timeline: true
  appLogs: true
workflow: []

agentLab:
  scope:
    kind: team
    team: team:treeseed
    capacityProvider: capacity-provider:treeseed/local
  provider: local
  executionProvider: codex-treeseed
  presentation: race-control
  timeZone: America/New_York
  repositories: [market]
  agents: [evidence-researcher]
  agentClasses: []
  workdays:
    - id: evidence-researcher-profiles
      title: Evidence Researcher Activity Profiles
      agentTests: [guide-editorial-cycle]
      objectiveRefs: [objective:harden-documentation-automation-workday-loop]
      durationSeconds: 900
      timePolicy: { cooperativePlanningPercent: 90, governedExecutionPercent: 0, reservePercent: 10 }
      planningSession: { rounds: 3, assignmentTimeboxSeconds: 900, tokenWarning: 24000 }
      maxActiveAssignments: 1
      planningOnly: true

training: { enabled: false }
