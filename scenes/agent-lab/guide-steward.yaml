schemaVersion: treeseed.scene/v1
id: guide-guide-steward-agent-lab
title: Guide Strategy Editor Production Agent Lab
description: Verify every production-eligible activity profile for the Guide Strategy Editor in one short workday before integrated Guide execution.
audience: [operator, agent-developer, qa]

journey:
  kind: agent-lab
  proves: [agent-testing/production-lab]

mode: { test: true, demo: false, training: false }
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport: { width: 1600, height: 1000 }
setup:
  dev: { required: true, reuseExisting: true }
  seeds:
    - name: treeseed
      environments: [local]
      apply: true
artifacts:
  trace: false
  video: false
  screenshots: false
  console: true
  network: true
  timeline: true
  appLogs: true
workflow: []

agentLab:
  scope:
    kind: team
    team: team:treeseed
    capacityProvider: capacity-provider:treeseed/agents
  provider: local
  executionProvider: codex-treeseed
  presentation: race-control
  timeZone: America/New_York
  repositories: [market]
  # These real upstream/review agents close the Steward's evidence-ready,
  # proposal-reviewed, and proposal-estimated contracts. No synthetic signal
  # or planning shortcut is injected into the production-shaped workday.
  agents: [evidence-researcher, guide-steward, technical-verifier, audience-reviewer]
  agentClasses: []
  workdays:
    - id: guide-steward-profiles
      title: Guide Steward Activity Profiles
      agentTests: [guide-editorial-cycle]
      objectiveRefs: [objective:harden-documentation-automation-workday-loop]
      durationSeconds: 3600
      timePolicy: { cooperativePlanningPercent: 90, governedExecutionPercent: 0, reservePercent: 10 }
      planningSession: { rounds: 3, assignmentTimeboxSeconds: 900, tokenWarning: 24000 }
      maxActiveAssignments: 4
      planningOnly: true

training: { enabled: false }
